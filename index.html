  // 「看看我可以煮什麼」的核心比對函式：輸入使用者選擇的食材 id
  // 陣列，回傳每道料理「有哪些／缺哪些」，並依可煮程度排序。
  // 資料來源涵蓋官方料理＋使用者AI建立的料理（getSearchableDishes()），
  // 只判斷 dish.ingredients，不判斷 seasonings（鹽/油/醬油/糖
  // 這類常備調味料，不應該讓料理被判定成不能做）。
  function getAvailableDishesForIngredients(selectedIds){
    const selectedNames = selectedIds.map(id => {
      const ing = findIngredientById(id);
      return ing ? ing.name : id;
    });
    const userSet = new Set(selectedNames);
    const source = getSearchableDishes(); // 官方料理＋使用者AI建立的料理，兩者都要能被「我有食材」比對到
    const results = source.map(dish => {
      const have = [];
      const missing = [];
      dish.ingredients.forEach(ing => {
        const canonical = normalizeIngredientName(ing.name);
        if(userSet.has(canonical)){ have.push(ing.name); }
        else { missing.push(ing.name); }
      });
      return { dish, have, missing, missingCount: missing.length };
    });
    const relevant = results.filter(r => r.have.length > 0);
    relevant.sort((a, b) => {
      if(a.missingCount !== b.missingCount) return a.missingCount - b.missingCount;
      const ap = a.dish.priority || 1, bp = b.dish.priority || 1;
      if(ap !== bp) return ap - bp;
      return a.dish.name.localeCompare(b.dish.name, 'zh-Hant');
    });
    return relevant;
  }

  const views = { find:"view-find", detail:"view-detail", "selected-menu":"view-selected-menu", shopping:"view-shopping", signature:"view-signature", settings:"view-settings", admin:"view-admin" };
  function navigate(name){
    Object.values(views).forEach(id => document.getElementById(id).classList.remove('active'));
    document.getElementById(views[name]).classList.add('active');

    // 底部導覽的高亮：詳細頁是「鑽進去」的畫面，沒有自己的
    // 分頁，高亮跟著它最終會返回的那個分頁
    let highlightTab = name;
    if(name === 'detail'){ highlightTab = detailReturnView.indexOf('find') === 0 ? 'find' : detailReturnView; }

    document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
    const target = document.querySelector('.nav-item[data-tab="'+highlightTab+'"]');
    if(target) target.classList.add('active');
    window.scrollTo(0,0);
  }

        就命中，例如搜尋「雞」不會因食材「雞蛋」而誤判）
     注意：這個函式僅供「搜尋料理」使用。未來「我有食材」是
     判斷現有食材能不能滿足料理需求，邏輯不同，會另外設計，
     不會共用這個函式。 */
  function matchesQuery(dish, q){
    if(!q) return true;
    const query = q.trim().toLowerCase();
    if(dish.name.toLowerCase().includes(query)) return true;
    if(dish.aliases && dish.aliases.some(a => a.toLowerCase().includes(query))) return true;
    if(dish.ingredients && dish.ingredients.some(ing => ing.name.toLowerCase() === query)) return true;
    return false;
  }

  function getFilteredDishes(){
    return getSearchableDishes().filter(d => {
      const categoryOk = activeCategory === "全部" || d.category === activeCategory;
      return categoryOk && matchesQuery(d, searchQuery);
    });
  }

  function renderChips(){
    const chipRow = document.getElementById('chipRow');
    chipRow.innerHTML = getCategoryChips().map(cat =>
      '<button class="chip' + (cat === activeCategory ? ' active' : '') + '" data-category="' + cat + '">' + cat + '</button>'
    ).join('');
    chipRow.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        activeCategory = chip.dataset.category;
        renderChips();
        renderResults();
      });
    });
  }

  // 圖示統一從料理資料本身讀取（dish.icon），不依名稱或分類猜測。
  // 集中放在這一個函式，未來若要改成 iconType:"image" 或圖片網址，
  // 只需要修改這裡，畫面各處不用逐一調整。
  function getDishIcon(dish){
    return dish.icon || '🍽️';
  }

  function renderResults(){
    const list = document.getElementById('resultList');
    const results = getFilteredDishes();
    if(results.length === 0){
      const trimmedQuery = searchQuery.trim();
      if(trimmedQuery){
        list.innerHTML =
          '<div class="empty-state ai-empty-state">' +
            '<p class="ai-empty-title">目前資料庫還沒有這道料理</p>' +
            '<p class="ai-empty-desc">換個關鍵字，或看看「依食材找」能配到什麼</p>' +
          '</div>';
      } else {
        list.innerHTML = '<div class="empty-state">找不到符合的料理，換個關鍵字試試看</div>';
      }
      return;
    }
    list.innerHTML = results.map(d =>
      '<div class="dish-card" data-id="' + d.id + '">' +
        '<div class="dish-card-emoji">' + getDishIcon(d) + '</div>' +
        '<div class="dish-card-body">' +
          '<p class="dish-card-name">' + d.name + '</p>' +
          '<div class="dish-card-meta">' +
            '<span class="tag">' + d.category + '</span>' +
            '<span class="tag">' + d.difficulty + '</span>' +
            '<span class="tag">' + (d.prepTime + d.cookTime) + ' 分鐘</span>' +
          '</div>' +
        '</div>' +
      '</div>'
    ).join('');
    list.querySelectorAll('.dish-card').forEach(card => {
      card.addEventListener('click', () => openDetail(card.dataset.id));
    });
  }

  /* =========================================================
     料理詳細頁
     ========================================================= */
  /* =========================================================
     份量調整（只影響畫面顯示，不修改 DISHES 原始資料）
     ========================================================= */
  const QUICK_SERVINGS = [1,2,3,4,6];
  let currentDish = null;
  let currentServings = 0;

  // g/kg/ml/l 這類公制單位換算後取整數；其餘（顆/小匙/大匙/瓣...）
  // 取最接近的 0.5，避免出現 1.3333333 這種長串小數
  function formatAmount(amount, unit, ratio){
    const metricUnits = ["g","kg","ml","l"];
    let val = amount * ratio;
    val = metricUnits.includes(unit) ? Math.round(val) : Math.round(val * 2) / 2;
    return Number.isInteger(val) ? String(val) : val.toFixed(1);
  }

  function scaleItem(item, ratio){
    return { name:item.name, amount: formatAmount(item.amount, item.unit, ratio), unit:item.unit };
  }

  /* 米飯類料理的水量換算：
     - 「內鍋刻度」：水對齊米量的刻度數，直接等於換算後的米量，
       不能用比例公式另外計算，因為刻度本身就是1:1對齊的規則
     - 「比例」「量杯」：水量依 waterAmount 本身的比例換算
       （不同米種、不同方式的水米比例本來就不同，各自獨立設定） */
  function renderRiceInfo(riceInfo, ratio){
    const scaledRice = formatAmount(riceInfo.riceAmount, riceInfo.riceUnit, ratio);
    let waterDisplay;
    if(riceInfo.waterMethod === "內鍋刻度"){
      waterDisplay = scaledRice + ' ' + riceInfo.riceUnit + '（對齊內鍋刻度 ' + scaledRice + '）';
    } else {
      const scaledWater = formatAmount(riceInfo.waterAmount, riceInfo.riceUnit, ratio);
      waterDisplay = scaledWater + ' ' + riceInfo.riceUnit + '（' + riceInfo.waterMethod + '）';
    }
    return '' +
      '<div class="rice-row"><span>米種</span><span>' + riceInfo.riceType + '</span></div>' +
      '<div class="rice-row"><span>米量</span><span>' + scaledRice + ' ' + riceInfo.riceUnit + '</span></div>' +
      '<div class="rice-row"><span>水量</span><span>' + waterDisplay + '</span></div>' +
      '<div class="rice-row"><span>口感</span><span>' + riceInfo.texture + '</span></div>';
  }

  function renderIngredientList(items){
    return '<ul class="ingredient-list">' + items.map(i =>
      '<li class="ingredient-row"><span>' + i.name + '</span><span class="ingredient-row-right"><span class="ingredient-amount">' + i.amount + ' ' + i.unit + '</span></span></li>'
    ).join('') + '</ul>';
  }

  function renderServingsQuickChips(){
    return QUICK_SERVINGS.map(n =>
      '<button class="serv-chip' + (n === currentServings ? ' active' : '') + '" data-servings="' + n + '">' + n + ' 人</button>'
    ).join('');
  }

  // 份量變動時，只局部更新份量文字、快選按鈕、食材與調味料清單，
  // 不重新渲染整頁，避免手機畫面跳動
  function updateServingsUI(){
    if(!currentDish) return;
    const ratio = currentServings / currentDish.servings;
    document.getElementById('servingsValue').textContent = currentServings + ' 人份';
    document.querySelectorAll('#servingsQuick .serv-chip').forEach(chip => {
      chip.classList.toggle('active', parseInt(chip.dataset.servings, 10) === currentServings);
    });
    document.getElementById('ingredientListContainer').innerHTML = renderIngredientList(currentDish.ingredients.map(i => scaleItem(i, ratio)));
    document.getElementById('seasoningListContainer').innerHTML = renderIngredientList(currentDish.seasonings.map(i => scaleItem(i, ratio)));
    const riceContainer = document.getElementById('riceInfoContainer');
    if(riceContainer && currentDish.riceInfo){
      riceContainer.innerHTML = renderRiceInfo(currentDish.riceInfo, ratio);
    }
  }

  function adjustServings(delta){
    currentServings = Math.max(1, currentServings + delta);
    updateServingsUI();
  }

  function setServings(n){
    currentServings = Math.max(1, n);
    updateServingsUI();
  }

  let currentDetailPhase = 1;

  function renderDetail(dish){
    if(currentDetailPhase === 2){
      renderDetailPhase2(dish);
    } else {
      renderDetailPhase1(dish);
    }
  }

  // 階段一：規劃——份量、需要準備的食材／調味料／工具，
  // 可以直接點＋把缺的食材加入採購總管。這是進入詳細頁
  // 的預設畫面，不論從找料理或「這次要煮」進來都一樣。
  function renderDetailPhase1(dish){
    let html = '';
    const ratio = currentServings / dish.servings;

    html += '<div class="detail-hero">';
    html += '<h1 class="detail-name">' + dish.name + '</h1>';
    html += '<div class="detail-tags"><span class="tag">' + dish.category + '</span><span class="tag">' + dish.difficulty + '</span></div>';
    html += '</div>';

    html += '<div class="stat-grid">';
    html += '<div class="stat-cell"><p class="stat-value">' + dish.prepTime + ' 分</p><p class="stat-label">準備時間</p></div>';
    html += '<div class="stat-cell"><p class="stat-value">' + dish.cookTime + ' 分</p><p class="stat-label">烹調時間</p></div>';
    html += '</div>';

    // 份量調整
    html += '<div class="servings-card">';
    html += '<div class="servings-header"><span>👥</span><span>份量</span></div>';
    html += '<div class="servings-control">';
    html += '<button class="serv-btn" id="servMinus" aria-label="減少一人份">－</button>';
    html += '<span class="servings-value" id="servingsValue">' + currentServings + ' 人份</span>';
    html += '<button class="serv-btn" id="servPlus" aria-label="增加一人份">＋</button>';
    html += '</div>';
    html += '<div class="servings-quick" id="servingsQuick">' + renderServingsQuickChips() + '</div>';
    html += '</div>';

    // 需要準備（食材＋特殊調味料都可以直接加入採購總管；
    // 常備調味料鹽/糖/醬油/米酒不會有＋按鈕）
    html += '<div class="detail-section">';
    html += '<p class="detail-section-title">🧺 需要準備</p>';
    html += '<p class="subgroup-label">主要食材</p><div id="ingredientListContainer">' + renderIngredientList(dish.ingredients.map(i => scaleItem(i, ratio))) + '</div>';
    html += '<p class="subgroup-label">調味料</p><div id="seasoningListContainer">' + renderIngredientList(dish.seasonings.map(i => scaleItem(i, ratio))) + '</div>';
    html += '<p class="subgroup-label">工具</p><div class="tool-tags">' + dish.tools.map(t => '<span class="tool-tag">' + t + '</span>').join('') + '</div>';
    html += '</div>';

    // 米飯資訊（只有米飯類料理才會有 riceInfo）
    if(dish.riceInfo){
      html += '<div class="detail-section">';
      html += '<p class="detail-section-title">🍚 米飯資訊</p>';
      html += '<div class="rice-card" id="riceInfoContainer">' + renderRiceInfo(dish.riceInfo, ratio) + '</div>';
      if(dish.riceInfo.riceNotes && dish.riceInfo.riceNotes.length){
        html += '<p class="subgroup-label">小提醒</p><ul class="note-list">' + dish.riceInfo.riceNotes.map(n => '<li class="note-item tip">' + n + '</li>').join('') + '</ul>';
      }
      html += '</div>';
    }

    // 加入這次要煮／開始料理：上下堆疊、同樣大小，
    // 用顏色區分（加入這次要煮＝jade綠色，開始料理＝主色），
    // 避免小小的舊按鈕太不顯眼被漏掉
    const inSelectedMenu = isInSelectedMenu(dish.id);
    html += '<div class="start-cook-wrap">';
    html += '<button class="add-to-menu-btn' + (inSelectedMenu ? ' added' : '') + '" id="selectedMenuToggleBtn">' + (inSelectedMenu ? '✓ 已加入今日料理' : '🔥 加入這次要煮') + '</button>';
    html += '</div>';
    html += '<div class="start-cook-wrap">';
    html += '<button class="start-cook-btn" id="startCookBtn">開始料理</button>';
    html += '</div>';

    document.getElementById('detailContent').innerHTML = html;
    document.getElementById('selectedMenuToggleBtn').addEventListener('click', () => {
      const wasIn = isInSelectedMenu(dish.id);
      toggleSelectedMenu(dish.id);
      renderDetail(dish);
      if(!wasIn){
        showToast('已加入這次要煮・目前共 ' + selectedMenuDishIds.length + ' 道');
      } else {
        showToast('已從這次要煮移除');
      }
    });
    document.getElementById('startCookBtn').addEventListener('click', () => {
      currentDetailPhase = 2;
      renderDetail(dish);
      window.scrollTo(0, 0);
    });
    document.getElementById('servMinus').addEventListener('click', () => adjustServings(-1));
    document.getElementById('servPlus').addEventListener('click', () => adjustServings(1));
    document.querySelectorAll('#servingsQuick .serv-chip').forEach(chip => {
      chip.addEventListener('click', () => setServings(parseInt(chip.dataset.servings, 10)));
    });
  }

  // 階段二：備料／烹調步驟／小技巧／常見錯誤，一次全部
  // 列出來（不是逐步STEP模式），讓使用者食材備好後，
  // 心裡有底再按「開始SOP」進入真正逐步的料理模式。
  function renderDetailPhase2(dish){
    let html = '';

    html += '<button class="detail-phase-back" id="detailPhaseBackBtn">← 返回準備</button>';
    html += '<div class="detail-hero" style="padding-top:0;">';
    html += '<h1 class="detail-name">' + dish.name + '</h1>';
    html += '<div class="detail-tags"><span class="tag">' + currentServings + ' 人份</span></div>';
    html += '</div>';

    html += '<div class="detail-section">';
    html += '<p class="detail-section-title">🔪 備料</p>';
    html += '<ul class="step-list">' + dish.preparationSteps.map((s, idx) =>
      '<li class="prep-step"><span class="step-num">' + (idx + 1) + '</span><span>' + s + '</span></li>'
    ).join('') + '</ul>';
    html += '</div>';

    html += '<div class="detail-section">';
    html += '<p class="detail-section-title">🔥 烹調步驟</p>';
    html += '<ul class="step-list">' + dish.cookingSteps.map(s =>
      '<li class="cook-step">' +
        '<div class="cook-step-head">' +
          '<span class="cook-step-num">' + s.step + '</span>' +
          '<div class="cook-step-badges">' +
            '<span class="badge">' + s.heatLevel + '</span>' +
            (s.time ? '<span class="badge">' + s.time + ' 分</span>' : '') +
          '</div>' +
        '</div>' +
        '<p class="cook-step-desc">' + s.description + '</p>' +
      '</li>'
    ).join('') + '</ul>';
    html += '</div>';

    html += '<div class="detail-section">';
    html += '<p class="detail-section-title">💡 小技巧</p>';
    html += '<ul class="note-list">' + dish.tips.map(t => '<li class="note-item tip">' + t + '</li>').join('') + '</ul>';
    html += '</div>';

    html += '<div class="detail-section">';
    html += '<p class="detail-section-title">⚠️ 常見錯誤</p>';
    html += '<ul class="note-list">' + dish.commonMistakes.map(m => '<li class="note-item mistake">' + m + '</li>').join('') + '</ul>';
    html += '</div>';

    // SOP逐步模式現在只是小功能鈕：不一定要真的逐步照做，
    // 前面備料／步驟都看過、心裡有底，就可以直接收藏拿手菜，
    // 不用強迫一定要開SOP才能決定喜不喜歡這道菜
    html += '<div class="start-cook-wrap">';
    html += '<button class="sop-secondary-btn" id="startSopBtn">▶ 開始 SOP 逐步模式</button>';
    html += '</div>';

    const inSignature = mySignatureDishIds.includes(dish.id);
    html += '<div class="start-cook-wrap">';
    html += '<button class="start-cook-btn' + (inSignature ? ' added' : '') + '" id="signatureToggleBtn">' + (inSignature ? '✓ 已加入我的拿手菜' : '⭐ 加入我的拿手菜') + '</button>';
    html += '</div>';

    document.getElementById('detailContent').innerHTML = html;
    document.getElementById('detailPhaseBackBtn').addEventListener('click', () => {
      currentDetailPhase = 1;
      renderDetail(dish);
      window.scrollTo(0, 0);
    });
    document.getElementById('startSopBtn').addEventListener('click', () => {
      startSOP(currentDish, currentServings);
    });
    document.getElementById('signatureToggleBtn').addEventListener('click', () => {
      toggleSignatureDish(dish.id);
      renderDetail(dish);
    });
  }

  let detailReturnView = 'find-recipe'; // 詳細頁返回鍵要回到哪個畫面，預設回到找食譜的「依菜色找」

  function openDetail(id, returnView, initialServings){
    const dish = findDishById(id);
    if(!dish) return;
    currentDish = dish;
    currentServings = initialServings || dish.servings; // 若指定初始份量（例如來自這次要煮），優先使用
    currentDetailPhase = 1; // 每次重新進入詳細頁，都從規劃階段開始
    detailReturnView = returnView || 'find-recipe';
    document.querySelector('#view-detail .page-title').textContent = dish.name;
    renderDetail(dish);
    navigate('detail');
  }

  function goBackFromDetail(){
    if(detailReturnView === 'find-recipe'){ findMode = 'recipe'; renderFindView(); navigate('find'); }
    else if(detailReturnView === 'find-ingredients'){ findMode = 'ingredients'; renderFindView(); navigate('find'); }
    else if(detailReturnView === 'selected-menu'){ renderSelectedMenuView(); navigate('selected-menu'); }
    else if(detailReturnView === 'signature'){ renderSignatureView(); navigate('signature'); }
    else { navigate(detailReturnView); }
  }

  /* =========================================================
     首頁互動
     ========================================================= */
  const toastEl = document.getElementById('toast');
  let toastTimer = null;
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> toastEl.classList.remove('show'), 1600);
  }

  /* ---------- 找食譜：choice（兩個大按鈕）／recipe／ingredients ----------
     三層結構：
     choice　　　＝這個分頁的頂層（兩個大按鈕，沒有返回鍵）
     recipe　　　＝依菜色找的搜尋畫面（返回鍵回到choice）
     ingredients ＝依食材找（內部還有分類清單/詳細/結果，
                   自己的頂層(分類清單)返回鍵回choice，
                   往下鑽的返回鍵先退回分類清單）
     findGoBack() 統一處理這整個「返回」邏輯，不管卡在哪一層。 */
  let findMode = 'choice';

  // 只重繪目前狀態，不重置——detail頁／AI建立頁返回會用這個，
  // 保留使用者原本鑽到哪一層
  function renderFindView(){
    document.getElementById('findChoiceContent').style.display = findMode === 'choice' ? 'block' : 'none';
    document.getElementById('findRecipeContent').style.display = findMode === 'recipe' ? 'block' : 'none';
    document.getElementById('findIngredientsContent').style.display = findMode === 'ingredients' ? 'block' : 'none';

    document.getElementById('findBackBtn').style.display = findMode === 'choice' ? 'none' : '';

    if(findMode === 'recipe'){
      renderChips();
      renderResults();
    } else if(findMode === 'ingredients'){
      renderIngredientsView();
    }
  }

  // 從底部導航／選擇畫面按鈕點進來時使用：每次都重置回
  // 該模式的頂層（choice 本身沒有內部狀態，不用重置）
  function openFindView(mode){
    findMode = mode || 'choice';
    if(findMode === 'recipe'){
      searchQuery = '';
      activeCategory = '全部';
      document.getElementById('searchInput').value = '';
    } else if(findMode === 'ingredients'){
      ingredientsScreen = 'categories';
      ingredientSearchQuery = '';
    }
    renderFindView();
    navigate('find');
  }

  // 返回鍵統一入口：依目前卡在哪一層，決定要退到哪裡
  function findGoBack(){
    if(findMode === 'recipe'){
      findMode = 'choice';
      renderFindView();
    } else if(findMode === 'ingredients'){
      if(ingredientsScreen === 'category-detail' || ingredientsScreen === 'results'){
        ingredientsScreen = 'categories';
        ingredientSearchQuery = '';
        renderIngredientsView();
      } else {
        findMode = 'choice';
        renderFindView();
      }
    }
    window.scrollTo(0, 0);
  }

  document.querySelectorAll('.find-choice-btn').forEach(btn => {
    btn.addEventListener('click', () => openFindView(btn.dataset.findMode));
  });

  document.getElementById('searchInput').addEventListener('input', (e)=>{
    searchQuery = e.target.value;
    renderResults();
  });

  document.getElementById('findBackBtn').addEventListener('click', () => findGoBack());
  document.getElementById('detailBackBtn').addEventListener('click', () => goBackFromDetail());

  const navItems = document.querySelectorAll('.nav-item');
  navItems.forEach(item=>{
    item.addEventListener('click', ()=>{
      const tab = item.dataset.tab;
      if(tab === 'find'){ openFindView('choice'); }
      else if(tab === 'selected-menu'){ openSelectedMenuView(); }
      else if(tab === 'shopping'){ openShoppingListView(); }
      else if(tab === 'signature'){ openSignatureView(); }
    });
  });

  /* =========================================================
     料理 SOP 模式（全螢幕）
     - 使用進入 SOP 當下的份量（currentServings），
       不會重新使用原始 servings 的資料
     - 只操作 dish.cookingSteps，不會修改 DISHES 原始資料
     - 「加入我的拿手菜」「完成紀錄」目前只存在前端暫存
       陣列，尚未接 Firebase
     ========================================================= */
  let sopDish = null;
  let sopServings = 0;
  let sopStepIndex = 0;
  let sopSelectedRating = 0;

  // 「我的拿手菜」＝收藏／常做清單，取代原本「我的菜單」的
  // 角色：可以在料理詳細頁直接收藏（不用等煮完），也可以在
  // SOP完成畫面加入。cookLogs 記錄每次「完成料理」的紀錄，
  // 拿手菜清單本身跟「有沒有煮過」是分開的兩件事。
  const MY_SIGNATURE_KEY = 'jiachangzhu_my_signature_v1';
  const COOK_LOGS_KEY = 'jiachangzhu_cook_logs_v1';
  let mySignatureDishIds = [];
  let cookLogs = [];

  function loadMySignatureDishIds(){
    try {
      const raw = localStorage.getItem(MY_SIGNATURE_KEY);
      mySignatureDishIds = raw ? JSON.parse(raw) : [];
    } catch(e){ mySignatureDishIds = []; }
  }
  function saveMySignatureDishIds(){
    try { localStorage.setItem(MY_SIGNATURE_KEY, JSON.stringify(mySignatureDishIds)); } catch(e){}
  }
  loadMySignatureDishIds();

  function loadCookLogs(){
    try {
      const raw = localStorage.getItem(COOK_LOGS_KEY);
      cookLogs = raw ? JSON.parse(raw) : [];
    } catch(e){ cookLogs = []; }
  }
  function saveCookLogs(){
    try { localStorage.setItem(COOK_LOGS_KEY, JSON.stringify(cookLogs)); } catch(e){}
  }
  loadCookLogs();

  // 加入/移除我的拿手菜是可切換的，唯一入口在料理詳細頁
  // 的「備料／步驟總覽」頁最下方——不用等真的完成SOP，
  // 步驟看過、心裡有底就可以收藏
  function toggleSignatureDish(dishId){
    const idx = mySignatureDishIds.indexOf(dishId);
    if(idx === -1){ mySignatureDishIds.push(dishId); }
    else { mySignatureDishIds.splice(idx, 1); }
    saveMySignatureDishIds();
  }

  function logCook(dishId, servings, rating, note){
    cookLogs.push({
      dishId: dishId,
      cookedAt: new Date().toISOString().slice(0, 10),
      servings: servings,
      rating: rating || null,
      note: note || ""
    });
    saveCookLogs();
  }

  function startSOP(dish, servings){
    if(!dish) return;
    sopDish = dish;
    sopServings = servings;
    sopStepIndex = 0;
    document.getElementById('sopDoneScreen').style.display = 'none';
    document.getElementById('sopStepScreen').style.display = 'block';
    document.getElementById('sopLeaveModal').style.display = 'none';
    renderSopStep();
    document.getElementById('sopOverlay').classList.add('active');
  }

  function renderSopStep(){
    const steps = sopDish.cookingSteps;
    const step = steps[sopStepIndex];

    document.getElementById('sopDishName').textContent = sopDish.name + '｜' + sopServings + ' 人份';
    document.getElementById('sopStepCount').textContent = 'STEP ' + (sopStepIndex + 1) + ' / ' + steps.length;

    document.getElementById('sopProgress').innerHTML = steps.map((_, i) =>
      '<span class="sop-dot' + (i <= sopStepIndex ? ' filled' : '') + '"></span>'
    ).join('');

    let badges = '<span class="sop-badge">🔥 ' + step.heatLevel + '</span>';
    if(step.time){ badges += '<span class="sop-badge time">⏱ ' + step.time + ' 分鐘</span>'; }
    document.getElementById('sopBadges').innerHTML = badges;
    document.getElementById('sopDesc').textContent = step.description;

    const tipEl = document.getElementById('sopTip');
    if(step.tip){
      tipEl.style.display = 'block';
      tipEl.textContent = '💡 小提醒：' + step.tip;
    } else {
      tipEl.style.display = 'none';
    }

    document.getElementById('sopPrevBtn').disabled = (sopStepIndex === 0);
    document.getElementById('sopNextBtn').textContent = (sopStepIndex === steps.length - 1) ? '完成料理' : '完成，下一步 →';
  }

  function sopNext(){
    const steps = sopDish.cookingSteps;
    if(sopStepIndex < steps.length - 1){
      sopStepIndex++;
      renderSopStep();
    } else {
      finishSOP();
    }
  }

  function sopPrev(){
    if(sopStepIndex > 0){
      sopStepIndex--;
      renderSopStep();
    }
  }

  function finishSOP(){
    document.getElementById('sopStepScreen').style.display = 'none';
    document.getElementById('sopDoneScreen').style.display = 'block';
    document.getElementById('sopDoneDishName').textContent = sopDish.name;

    // 完成SOP＝這道料理這次已經煮完了：從「這次要煮」移除，
    // 但「我的菜單」是長期收藏，完全不受影響
    const wasInSelectedMenu = isInSelectedMenu(sopDish.id);
    removeFromSelectedMenu(sopDish.id);

    const noteEl = document.getElementById('sopDoneMenuNote');
    if(wasInSelectedMenu){
      noteEl.textContent = '已從「這次要煮」移除・目前還有 ' + selectedMenuDishIds.length + ' 道';
      noteEl.style.display = 'block';
    } else {
      noteEl.textContent = '';
      noteEl.style.display = 'none';
    }

    sopSelectedRating = 0;
    document.getElementById('sopNote').value = '';
    renderSopStars();
  }

  function renderSopStars(){
    const starsEl = document.getElementById('sopStars');
    starsEl.innerHTML = [1,2,3,4,5].map(n =>
      '<span class="sop-star' + (n <= sopSelectedRating ? ' filled' : '') + '" data-star="' + n + '">★</span>'
    ).join('');
    starsEl.querySelectorAll('.sop-star').forEach(s => {
      s.addEventListener('click', () => {
        sopSelectedRating = parseInt(s.dataset.star, 10);
        renderSopStars();
      });
    });
  }

  function requestLeaveSOP(){
    document.getElementById('sopLeaveModal').style.display = 'flex';
  }
  function closeLeaveModal(){
    document.getElementById('sopLeaveModal').style.display = 'none';
  }
  function confirmLeaveSOP(){
    // 離開不標記完成，也不寫入任何完成紀錄
    document.getElementById('sopLeaveModal').style.display = 'none';
    document.getElementById('sopOverlay').classList.remove('active');
  }
  function exitSopDone(){
    document.getElementById('sopOverlay').classList.remove('active');
  }

  document.getElementById('sopCloseBtn').addEventListener('click', requestLeaveSOP);
  document.getElementById('sopPrevBtn').addEventListener('click', sopPrev);
  document.getElementById('sopNextBtn').addEventListener('click', sopNext);
  document.getElementById('sopStayBtn').addEventListener('click', closeLeaveModal);
  document.getElementById('sopLeaveBtn').addEventListener('click', confirmLeaveSOP);
  document.getElementById('sopDoneExitBtn').addEventListener('click', exitSopDone);

  document.getElementById('sopSaveRatingBtn').addEventListener('click', () => {
    const note = document.getElementById('sopNote').value.trim();
    logCook(sopDish.id, sopServings, sopSelectedRating, note);
    showToast('已儲存這次的紀錄');
  });

  /* =========================================================
     我有食材（畫面狀態與渲染）
     ---------------------------------------------------------
     三個畫面狀態：
     - categories：landing頁，「今天冰箱裡有什麼？」+ 分類按鈕
       （主要操作方式，不是文字輸入框）
     - category-detail：點某個分類後，該分類食材的勾選清單
     - results：按「看看我可以煮什麼」後才顯示比對結果
       （不是即時邊選邊算，避免畫面一開始就塞滿資訊）
     selectedIngredients／userCreatedIngredients 已在資料層
     中透過 localStorage 載入，這裡只負責畫面。
     ========================================================= */
  let ingredientsScreen = 'categories';
  let ingredientsActiveCategory = null;
  let ingredientSearchQuery = '';

  function toggleIngredientSelection(id){
    const idx = selectedIngredients.indexOf(id);
    if(idx === -1){
      selectedIngredients.push(id);
    } else {
      selectedIngredients.splice(idx, 1);
    }
    saveSelectedIngredients();
    renderIngredientsView();
  }

  function renderSelectedBar(){
    if(selectedIngredients.length === 0){
      return '<div class="my-ingredients-bar"><p class="my-ingredients-empty">尚未選擇食材</p></div>';
    }
    const chips = selectedIngredients.map(id => {
      const ing = findIngredientById(id);
      const label = ing ? ing.name : id;
      return '<button class="my-ing-chip" data-remove-id="' + id + '">' + label + ' <span class="remove-x">×</span></button>';
    }).join('');
    return '<div class="my-ingredients-bar">' +
      '<div class="clear-row">' +
        '<p class="my-ingredients-label">已選 ' + selectedIngredients.length + ' 種食材</p>' +
        '<button class="clear-link-btn" id="clearIngredientsBtn">清空</button>' +
      '</div>' +
      '<div class="my-ingredients-chips">' + chips + '</div>' +
    '</div>';
  }

  function bindClearIngredientsBtn(){
    const btn = document.getElementById('clearIngredientsBtn');
    if(btn){
      btn.addEventListener('click', () => {
        selectedIngredients = [];
        saveSelectedIngredients();
        renderIngredientsView();
      });
    }
  }

  function renderCtaButton(){
    const disabled = selectedIngredients.length === 0;
    return '<div class="ingredients-cta-wrap">' +
      '<button class="ingredients-cta-btn" id="viewResultsBtn"' + (disabled ? ' disabled' : '') + '>看看我可以煮什麼</button>' +
    '</div>';
  }

  function renderIngredientCheckRow(id){
    const ing = findIngredientById(id);
    if(!ing) return '';
    const selected = selectedIngredients.includes(id);
    const inStock = isNameInInventory(ing.name);
    return '<button class="ing-check-row' + (selected ? ' selected' : '') + '" data-ingredient-id="' + id + '">' +
      '<span class="ing-check-box">' + (selected ? '☑' : '☐') + '</span>' +
      '<span class="ing-check-icon">' + ing.icon + '</span>' +
      '<span class="ing-check-name">' + ing.name + '</span>' +
      (inStock ? '<span class="ing-stock-hint">庫存中</span>' : '') +
    '</button>';
  }

  // ---------- categories 畫面 ----------
  function renderCategoriesScreen(){
    let html = '';
    html += '<p class="ingredients-headline">今天冰箱裡有什麼？</p>';
    html += renderSelectedBar();

    html += '<div class="search-wrap"><label class="search-box">';
    html += '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#867A6C" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>';
    html += '<input type="text" id="ingredientSearchInput" placeholder="搜尋食材" autocomplete="off">';
    html += '</label></div>';

    html += '<div id="ingredientSearchResultsContainer">' + renderCategoriesOrSearchBody() + '</div>';
    html += renderCtaButton();

    document.getElementById('ingredientsContent').innerHTML = html;
    document.getElementById('ingredientSearchInput').value = ingredientSearchQuery;
    bindCategoriesScreenEvents();
  }

  // 依目前是否有搜尋文字，決定顯示「分類按鈕」還是「搜尋結果勾選清單」
  function renderCategoriesOrSearchBody(){
    const q = ingredientSearchQuery.trim();
    if(!q){
      return '<div class="ingredient-category-grid">' +
        getIngredientCategories().map(cat =>
          '<button class="ingredient-category-btn" data-category="' + cat + '">' +
            '<span class="ingredient-category-icon">' + ingredientCategoryIcon(cat) + '</span>' +
            '<span class="ingredient-category-name">' + cat + '</span>' +
          '</button>'
        ).join('') +
      '</div>';
    }
    const query = q.toLowerCase();
    const matches = getAllIngredients().filter(e =>
      e.name.toLowerCase().includes(query) || (e.aliases || []).some(a => a.toLowerCase().includes(query))
    );
    if(matches.length === 0){
      return '<div class="ingredient-empty-state">' +
        '<p class="ingredient-empty-emoji">🔍</p>' +
        '<p class="ingredient-empty-title">目前資料庫還沒有這個食材</p>' +
        '<p class="ingredient-empty-desc">換個關鍵字試試看</p>' +
      '</div>';
    }
    return '<div class="ing-check-list">' + matches.map(e => renderIngredientCheckRow(e.id)).join('') + '</div>';
  }

  // 只更新搜尋結果區塊，不重繪整頁，輸入框才不會失去焦點
  function updateIngredientSearchResultsOnly(){
    document.getElementById('ingredientSearchResultsContainer').innerHTML = renderCategoriesOrSearchBody();
    bindSearchResultsAreaEvents();
  }

  function bindSearchResultsAreaEvents(){
    document.querySelectorAll('#ingredientSearchResultsContainer .ingredient-category-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        ingredientsActiveCategory = btn.dataset.category;
        ingredientsScreen = 'category-detail';
        ingredientSearchQuery = '';
        renderIngredientsView();
        window.scrollTo(0, 0);
      });
    });
    document.querySelectorAll('#ingredientSearchResultsContainer .ing-check-row').forEach(btn => {
      btn.addEventListener('click', () => toggleIngredientSelection(btn.dataset.ingredientId));
    });
  }

  function bindCategoriesScreenEvents(){
    document.getElementById('ingredientSearchInput').addEventListener('input', (e) => {
      ingredientSearchQuery = e.target.value;
      updateIngredientSearchResultsOnly();
    });
    bindSearchResultsAreaEvents();
    bindClearIngredientsBtn();
    document.querySelectorAll('.my-ing-chip').forEach(chip => {
      chip.addEventListener('click', () => toggleIngredientSelection(chip.dataset.removeId));
    });
    const ctaBtn = document.getElementById('viewResultsBtn');
    ctaBtn.addEventListener('click', () => {
      if(selectedIngredients.length === 0) return;
      ingredientsScreen = 'results';
      renderIngredientsView();
      window.scrollTo(0, 0);
    });
  }

  // ---------- category-detail 畫面 ----------
  function renderCategoryDetailScreen(){
    const cat = ingredientsActiveCategory;
    const items = getAllIngredients().filter(e => e.category === cat);
    let html = '';
    html += renderSelectedBar();
    html += '<p class="section-label">' + ingredientCategoryIcon(cat) + ' ' + cat + '</p>';
    html += '<div class="ing-check-list">' + items.map(e => renderIngredientCheckRow(e.id)).join('') + '</div>';
    html += renderCtaButton();

    document.getElementById('ingredientsContent').innerHTML = html;
    bindClearIngredientsBtn();
    document.querySelectorAll('.my-ing-chip').forEach(chip => {
      chip.addEventListener('click', () => toggleIngredientSelection(chip.dataset.removeId));
    });
    document.querySelectorAll('.ing-check-row').forEach(btn => {
      btn.addEventListener('click', () => toggleIngredientSelection(btn.dataset.ingredientId));
    });
    const ctaBtn = document.getElementById('viewResultsBtn');
    ctaBtn.addEventListener('click', () => {
      if(selectedIngredients.length === 0) return;
      ingredientsScreen = 'results';
      renderIngredientsView();
      window.scrollTo(0, 0);
    });
  }

  // ---------- results 畫面 ----------
  function renderIngredientResultDishCard(r){
    const d = r.dish;
    let badge, missingLine = '';
    if(r.missingCount === 0){
      badge = '<span class="match-badge ok">🟢 可以煮</span>';
    } else if(r.missingCount <= 2){
      badge = '<span class="match-badge mid">🟡 還缺 ' + r.missingCount + ' 種食材</span>';
      missingLine = '<p class="match-missing">缺少：' + r.missing.join('、') + '</p>';
    } else {
      badge = '<span class="match-badge low">⚪ 需要再準備一些食材</span>';
      missingLine = '<p class="match-missing">缺少：' + r.missing.join('、') + '</p>';
    }
    return '<div class="dish-card" data-id="' + d.id + '">' +
      '<div class="dish-card-emoji">' + getDishIcon(d) + '</div>' +
      '<div class="dish-card-body">' +
        '<p class="dish-card-name">' + d.name + '</p>' +
        '<div class="dish-card-meta">' +
          '<span class="tag">' + d.difficulty + '</span>' +
          '<span class="tag">' + (d.prepTime + d.cookTime) + ' 分鐘</span>' +
          '<span class="tag">' + d.servings + ' 人份</span>' +
        '</div>' +
        badge + missingLine +
      '</div>' +
    '</div>';
  }

  function renderResultsScreen(){
    let html = '<p class="menu-headline">可以煮什麼</p>';
    const results = getAvailableDishesForIngredients(selectedIngredients);
    if(results.length === 0){
      html += '<div class="ingredient-empty-state">' +
        '<p class="ingredient-empty-emoji">🧺</p>' +
        '<p class="ingredient-empty-title">目前還沒有找到適合的料理</p>' +
        '<p class="ingredient-empty-desc">再選幾樣食材試試看</p>' +
      '</div>';
    } else {
      html += '<p class="section-label">可以煮的料理</p>';
      html += '<div class="result-list" id="ingredientResultsContainer">' +
        results.map(r => renderIngredientResultDishCard(r)).join('') +
      '</div>';
    }
    document.getElementById('ingredientsContent').innerHTML = html;
    const resultsContainer = document.getElementById('ingredientResultsContainer');
    if(resultsContainer){
      resultsContainer.querySelectorAll('.dish-card').forEach(card => {
        card.addEventListener('click', () => openDetail(card.dataset.id, 'find-ingredients'));
      });
    }
  }

  function renderIngredientsView(){
    if(ingredientsScreen === 'categories'){
      renderCategoriesScreen();
    } else if(ingredientsScreen === 'category-detail'){
      renderCategoryDetailScreen();
    } else {
      renderResultsScreen();
    }
  }


  /* =========================================================
     這次要煮（畫面邏輯）
     ---------------------------------------------------------
     selectedMenuDishIds 現在完全獨立，不依附任何長期收藏。
     「☑ 標記已完成」是不透過 SOP 的快速完成路徑，會建立一筆
     沒有評分的 cookLog（代表確實做過），跟「✕ 移除」（純粹
     這次不煮了、不算做過）語意上是不同的動作。
     ========================================================= */
  function openSelectedMenuView(){
    renderSelectedMenuView();
    navigate('selected-menu');
  }

  function renderSelectedMenuCard(dish){
    const servings = getMenuServings(dish.id);
    const meal = getMealTime(dish.id);
    return '<div class="menu-card" data-dish-id="' + dish.id + '">' +
      '<div class="menu-card-head">' +
        '<div class="menu-card-emoji">' + getDishIcon(dish) + '</div>' +
        '<div class="menu-card-body">' +
          '<p class="menu-card-name">' + dish.name + '</p>' +
          '<p class="menu-card-meta">' + dish.difficulty + '｜' + (dish.prepTime + dish.cookTime) + ' 分鐘</p>' +
        '</div>' +
      '</div>' +
      '<div class="menu-card-servings">' +
        '<button class="menu-serv-btn" data-serv-minus="' + dish.id + '">－</button>' +
        '<span class="menu-serv-value">' + servings + ' 人份</span>' +
        '<button class="menu-serv-btn" data-serv-plus="' + dish.id + '">＋</button>' +
      '</div>' +
      '<div class="meal-chip-row">' +
        '<button class="meal-chip' + (meal === 'breakfast' ? ' active' : '') + '" data-meal-dish="' + dish.id + '" data-meal="breakfast">🌅 早餐</button>' +
        '<button class="meal-chip' + (meal === 'lunch' ? ' active' : '') + '" data-meal-dish="' + dish.id + '" data-meal="lunch">☀️ 午餐</button>' +
        '<button class="meal-chip' + (meal === 'dinner' ? ' active' : '') + '" data-meal-dish="' + dish.id + '" data-meal="dinner">🌙 晚餐</button>' +
      '</div>' +
      '<button class="selected-menu-start-btn" data-start-cook="' + dish.id + '">📋 料理詳細說明</button>' +
      '<div class="selected-menu-card-actions">' +
        '<button class="selected-menu-action-btn complete" data-complete-dish="' + dish.id + '">☑ 標記已完成</button>' +
        '<button class="selected-menu-action-btn remove" data-remove-selected="' + dish.id + '">✕ 移除</button>' +
      '</div>' +
    '</div>';
  }

  function renderSelectedMenuView(){
    const dishes = getSelectedMenuDishes();
    let html = '<div class="clear-row">' +
      '<p class="menu-subtitle" style="padding:0;">準備煮的料理</p>' +
      (dishes.length > 0 ? '<button class="clear-link-btn" id="clearSelectedMenuBtn">清空</button>' : '') +
    '</div>';

    if(dishes.length === 0){
      html += '<div class="menu-empty-state">' +
        '<p class="menu-empty-emoji">🔥</p>' +
        '<p class="menu-empty-title">目前沒有要煮的料理</p>' +
        '<p class="menu-empty-desc">回「我的菜單」挑幾道加入這次要煮吧</p>' +
      '</div>';
    } else {
      const groups = { breakfast:[], lunch:[], dinner:[], unassigned:[] };
      dishes.forEach(d => {
        const meal = getMealTime(d.id);
        if(meal === 'breakfast'){ groups.breakfast.push(d); }
        else if(meal === 'lunch'){ groups.lunch.push(d); }
        else if(meal === 'dinner'){ groups.dinner.push(d); }
        else { groups.unassigned.push(d); }
      });
      const sections = [
        { label:'🌅 早餐', items: groups.breakfast },
        { label:'☀️ 午餐', items: groups.lunch },
        { label:'🌙 晚餐', items: groups.dinner },
        { label:'📋 未分類', items: groups.unassigned }
      ];
      sections.forEach(sec => {
        if(sec.items.length === 0) return; // 沒有料理的分類不佔畫面
        html += '<p class="section-label">' + sec.label + '（' + sec.items.length + ' 道）</p>';
        html += '<div class="menu-list">' + sec.items.map(d => renderSelectedMenuCard(d)).join('') + '</div>';
      });
    }

    html += '<div class="menu-cta-wrap">' +
      '<button class="menu-cta-btn" id="generateShoppingBtn"' + (dishes.length === 0 ? ' disabled' : '') + '>🛒 查看這次採購</button>' +
    '</div>';
    html += '<p class="menu-cta-hint">回「我的菜單」可以加入更多要煮的料理</p>';

    document.getElementById('selectedMenuContent').innerHTML = html;
    bindSelectedMenuViewEvents();
  }

  function bindSelectedMenuViewEvents(){
    const clearBtn = document.getElementById('clearSelectedMenuBtn');
    if(clearBtn){
      clearBtn.addEventListener('click', () => {
        selectedMenuDishIds = [];
        saveSelectedMenu();
        renderSelectedMenuView();
      });
    }
    document.querySelectorAll('#selectedMenuContent [data-meal-dish]').forEach(btn => {
      btn.addEventListener('click', () => {
        const dishId = btn.dataset.mealDish;
        const meal = btn.dataset.meal;
        setMealTime(dishId, getMealTime(dishId) === meal ? null : meal);
        renderSelectedMenuView();
      });
    });
    document.querySelectorAll('#selectedMenuContent [data-serv-minus]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.servMinus;
        setMenuServings(id, getMenuServings(id) - 1);
        renderSelectedMenuView();
      });
    });
    document.querySelectorAll('#selectedMenuContent [data-serv-plus]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.servPlus;
        setMenuServings(id, getMenuServings(id) + 1);
        renderSelectedMenuView();
      });
    });
    document.querySelectorAll('#selectedMenuContent [data-start-cook]').forEach(btn => {
      btn.addEventListener('click', () => {
        const dish = getDishById(btn.dataset.startCook);
        if(dish){ openDetail(dish.id, 'selected-menu', getMenuServings(dish.id)); }
      });
    });
    document.querySelectorAll('#selectedMenuContent [data-complete-dish]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.completeDish;
        logCook(id, getMenuServings(id), null, '');
        removeFromSelectedMenu(id);
        showToast('已標記完成');
        renderSelectedMenuView();
      });
    });
    document.querySelectorAll('#selectedMenuContent [data-remove-selected]').forEach(btn => {
      btn.addEventListener('click', () => {
        removeFromSelectedMenu(btn.dataset.removeSelected);
        renderSelectedMenuView();
      });
    });
    const genBtn = document.getElementById('generateShoppingBtn');
    if(genBtn){
      genBtn.addEventListener('click', () => {
        if(getSelectedMenuDishes().length === 0) return;
        openShoppingListView();
      });
    }
  }

  /* =========================================================
     採購（畫面邏輯）
     ---------------------------------------------------------
     這個分頁本身就是「這次要煮」自動整合出來的完整清單，
     沒有另外的「建議畫面」或「加入」動作——每一項直接顯示
     在這裡，狀態（要買／已有）點一下就能切換，畫面永遠是
     computeShoppingOverview() 當下算出來的最新結果。
     ========================================================= */
  const SHOPPING_CATEGORY_ORDER = ["肉類","雞肉","海鮮","蔬菜","蛋豆製品","菇類","辛香料","主食","調味料"];
  const MANUAL_ITEM_CATEGORIES = ["蔬菜","肉類","雞肉","海鮮","蛋豆製品","菇類","辛香料","主食","調味料","其他"];
  let shoppingDoneExpanded = false;
  let manualItemCategory = "其他";
  function getShoppingCategoryOrder(items){
    const found = new Set(items.map(i => i.category));
    const ordered = SHOPPING_CATEGORY_ORDER.filter(c => found.has(c));
    found.forEach(c => { if(!ordered.includes(c)) ordered.push(c); });
    return ordered;
  }

  function openShoppingListView(){
    renderShoppingView();
    navigate('shopping');
  }

  function renderShoppingRow(item){
    const key = item.name + '|' + item.unit;
    const deleteBtn = item.source === 'manual'
      ? '<button class="shopping-item-delete" data-delete-key="' + key + '" aria-label="刪除">✕</button>'
      : '';
    return '<div class="shopping-item-row' + (item.type === 'seasoning' ? ' seasoning' : '') + (item.status === 'have' ? ' checked' : '') + '">' +
      '<button class="shopping-item-toggle" data-item-key="' + key + '">' +
        '<span class="shopping-item-box">' + (item.status === 'have' ? '🟢' : '🛒') + '</span>' +
        '<span class="shopping-item-name">' + item.name + '</span>' +
        '<span class="shopping-item-amount">' + (item.amount ? item.amount + ' ' + item.unit : '') + '</span>' +
      '</button>' +
      deleteBtn +
    '</div>';
  }

  function renderShoppingSection(title, items){
    if(items.length === 0) return '';
    let html = title ? '<p class="section-label">' + title + '（' + items.length + ' 項）</p>' : '';
    const categories = getShoppingCategoryOrder(items);
    categories.forEach(cat => {
      html += '<div class="shopping-group">';
      html += '<p class="shopping-group-title">' + ingredientCategoryIcon(cat) + ' ' + cat + '</p>';
      html += '<div class="shopping-item-list">';
      items.forEach(item => {
        if(item.category === cat){ html += renderShoppingRow(item); }
      });
      html += '</div></div>';
    });
    return html;
  }

  function renderShoppingView(){
    const overview = computeShoppingOverview();
    const needItems = overview.filter(i => i.status === 'need');
    const haveItems = overview.filter(i => i.status === 'have');

    let html = '<p class="menu-subtitle">這次要煮需要準備的全部食材，點一下切換要買／已有</p>';

    html += '<div class="shopping-actions-row">';
    html += '<button class="shopping-action-link" id="addManualItemBtn">＋ 新增採購項目</button>';
    html += '</div>';

    html += '<div class="manual-add-form" id="manualAddForm" style="display:none;">' +
      '<input type="text" id="manualItemInput" class="ai-name-input" placeholder="想買什麼？例如：牛奶">' +
      '<p class="manual-category-label">分類</p>' +
      '<div class="chip-row manual-category-row" id="manualCategoryRow">' +
        MANUAL_ITEM_CATEGORIES.map(cat =>
          '<button class="chip' + (cat === manualItemCategory ? ' active' : '') + '" data-manual-category="' + cat + '">' + cat + '</button>'
        ).join('') +
      '</div>' +
      '<button class="ai-generate-btn" id="confirmManualAddBtn">加入</button>' +
    '</div>';

    if(overview.length === 0){
      html += '<div class="shopping-empty-state">' +
        '<p class="shopping-empty-emoji">🛒</p>' +
        '<p class="shopping-empty-title">目前沒有需要準備的食材</p>' +
        '<p class="shopping-empty-desc">先到「要煮」分頁加入想煮的料理，或自己新增一項</p>' +
      '</div>';
    } else {
      html += renderShoppingSection('🛒 要買', needItems);
      if(haveItems.length > 0){
        html += '<button class="shopping-done-toggle" id="shoppingDoneToggleBtn">' +
          '✓ 已完成 ' + haveItems.length + ' 項' +
          '<span class="shopping-done-arrow">' + (shoppingDoneExpanded ? '▲' : '▼') + '</span>' +
        '</button>';
        if(shoppingDoneExpanded){
          html += renderShoppingSection('', haveItems);
        }
      }
    }

    document.getElementById('shoppingContent').innerHTML = html;
    bindShoppingViewEvents();
  }

  function bindShoppingViewEvents(){
    const doneToggleBtn = document.getElementById('shoppingDoneToggleBtn');
    if(doneToggleBtn){
      doneToggleBtn.addEventListener('click', () => {
        shoppingDoneExpanded = !shoppingDoneExpanded;
        renderShoppingView();
      });
    }
    document.querySelectorAll('#shoppingContent .shopping-item-toggle').forEach(row => {
      row.addEventListener('click', () => {
        const key = row.dataset.itemKey;
        const overview = computeShoppingOverview();
        const item = overview.find(i => (i.name + '|' + i.unit) === key);
        if(!item) return;
        toggleInventoryStatus(item);
        showToast(item.status === 'have' ? '已標記為要買' : '已標記為已有');
        renderShoppingView();
      });
    });
    document.querySelectorAll('#shoppingContent .shopping-item-delete').forEach(btn => {
      btn.addEventListener('click', () => {
        const key = btn.dataset.deleteKey;
        const separatorIdx = key.lastIndexOf('|');
        const name = key.slice(0, separatorIdx);
        const unit = key.slice(separatorIdx + 1);
        removeManualShoppingItem(name, unit);
        showToast('已刪除');
        renderShoppingView();
      });
    });
    const addBtn = document.getElementById('addManualItemBtn');
    if(addBtn){
      addBtn.addEventListener('click', () => {
        manualItemCategory = '其他';
        const form = document.getElementById('manualAddForm');
        form.style.display = 'block';
        document.getElementById('manualItemInput').focus();
      });
    }
    document.querySelectorAll('#manualCategoryRow .chip').forEach(chip => {
      chip.addEventListener('click', () => {
        manualItemCategory = chip.dataset.manualCategory;
        document.querySelectorAll('#manualCategoryRow .chip').forEach(c => {
          c.classList.toggle('active', c.dataset.manualCategory === manualItemCategory);
        });
      });
    });
    const confirmAddBtn = document.getElementById('confirmManualAddBtn');
    if(confirmAddBtn){
      confirmAddBtn.addEventListener('click', () => {
        const input = document.getElementById('manualItemInput');
        addManualShoppingItem(input.value, manualItemCategory);
        renderShoppingView();
      });
    }
  }

  /* =========================================================
     我的菜單（即原本的「我的拿手菜」，簡易列表，純讀取既有
     mySignatureDishIds／cookLogs 資料彙整顯示，沒有建立
     任何新的資料結構）
     ========================================================= */
  function openSignatureView(){
    renderSignatureView();
    navigate('signature');
  }

  function renderSignatureView(){
    const items = mySignatureDishIds.map(id => {
      const dish = getDishById(id);
      if(!dish) return null;
      const logs = cookLogs.filter(l => l.dishId === id);
      const cookedCount = logs.length;
      const lastCookedAt = logs.length ? logs.map(l => l.cookedAt).sort().slice(-1)[0] : null;
      return { dish, cookedCount, lastCookedAt };
    }).filter(Boolean);

    let html;
    if(items.length === 0){
      html = '<div class="menu-empty-state">' +
        '<p class="menu-empty-emoji">⭐</p>' +
        '<p class="menu-empty-title">還沒有拿手菜</p>' +
        '<p class="menu-empty-desc">完成料理後可以加入我的拿手菜</p>' +
      '</div>';
    } else {
      html = '<div class="clear-row">' +
        '<p class="menu-subtitle" style="padding:0;">收藏的料理</p>' +
        '<button class="clear-link-btn" id="clearSignatureBtn">清空</button>' +
      '</div>';
      html += '<div class="menu-list">' + items.map(it =>
        '<div class="menu-card" data-dish-id="' + it.dish.id + '">' +
          '<div class="menu-card-head">' +
            '<div class="menu-card-emoji">' + getDishIcon(it.dish) + '</div>' +
            '<div class="menu-card-body">' +
              '<p class="menu-card-name">' + it.dish.name + '</p>' +
              '<p class="menu-card-meta">' + (it.cookedCount ? '做過 ' + it.cookedCount + ' 次' : '尚未記錄次數') + (it.lastCookedAt ? '｜上次 ' + it.lastCookedAt : '') + '</p>' +
            '</div>' +
            '<button class="menu-card-remove-btn" data-remove-signature="' + it.dish.id + '" aria-label="移除">✕</button>' +
          '</div>' +
        '</div>'
      ).join('') + '</div>';
    }
    html += '<p class="app-version">v2026.09.01-4　清空功能版</p>';
    document.getElementById('signatureContent').innerHTML = html;
    const clearSigBtn = document.getElementById('clearSignatureBtn');
    if(clearSigBtn){
      clearSigBtn.addEventListener('click', () => {
        mySignatureDishIds = [];
        saveMySignatureDishIds();
        renderSignatureView();
      });
    }
    document.querySelectorAll('#signatureContent .menu-card-remove-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleSignatureDish(btn.dataset.removeSignature);
        renderSignatureView();
      });
    });
    document.querySelectorAll('#signatureContent .menu-card').forEach(card => {
      card.addEventListener('click', () => openDetail(card.dataset.dishId, 'signature'));
    });
  }
  // App要先通過登入才會顯示，這裡不再直接renderChips/
  // renderResults——那兩行現在移到enterApp()裡，只有登入
  // 通過後才會執行。這裡改成啟動整個登入流程判斷。
  _startAppFlow();
</script>
