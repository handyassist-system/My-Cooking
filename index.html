<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>家常煮｜今天，煮什麼？</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --color-bg:#F6F1E7;
    --color-surface:#FFFFFF;
    --color-text:#2B241D;
    --color-text-soft:#867A6C;
    --color-accent:#A8462E;
    --color-accent-dark:#8A3722;
    --color-accent-soft:#F1DCD2;
    --color-jade:#4F6A52;
    --color-jade-soft:#E1E9DE;
    --color-border:#E7DDCC;
    --radius-lg:22px;
    --radius-md:16px;
    --radius-sm:10px;
    --radius-pill:999px;

    /* ---- Typography Design System ---- */
    --font-family:'Noto Sans TC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

    --weight-regular:400;
    --weight-medium:500;
    --weight-semibold:600;
    --weight-bold:700;

    --fs-title:26px;       /* App Logo / 主標 */
    --fs-heading:22px;     /* 頁面標題 */
    --fs-section:18px;     /* 區塊標題 */
    --fs-card-title:17px;  /* 料理名稱 */
    --fs-body:15px;        /* 一般正文 / 食材名稱 / 按鈕 */
    --fs-caption:13px;     /* 輔助資訊 */
    --fs-label:12px;       /* 小標籤 */

    --lh-tight:1.3;   /* 大標題 */
    --lh-base:1.6;    /* 一般文字 */
    --lh-loose:1.75;  /* 料理步驟 */
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--color-bg);
    color:var(--color-text);
    font-family:var(--font-family);
    font-size:var(--fs-body);
    font-weight:var(--weight-regular);
    line-height:var(--lh-base);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }

  .app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:var(--color-bg);
    position:relative;
    padding-bottom:calc(84px + env(safe-area-inset-bottom));
  }

  .view{display:none;}
  .view.active{display:block;}

  /* ---------- Sub-page header (search / detail) ---------- */
  .page-header{
    display:flex;
    align-items:center;
    gap:12px;
    padding:20px 22px 14px;
  }
  .back-btn{
    width:38px; height:38px;
    border-radius:var(--radius-pill);
    border:1px solid var(--color-border);
    background:var(--color-surface);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .back-btn:active{transform:scale(0.94);}
  .header-settings-btn{
    margin-left:auto; flex-shrink:0;
    width:38px; height:38px; border-radius:var(--radius-pill);
    border:1px solid var(--color-border); background:var(--color-surface);
    display:flex; align-items:center; justify-content:center;
    font-size:17px; cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .header-settings-btn:active{transform:scale(0.94);}
  .page-title{
    font-weight:var(--weight-bold);
    font-size:var(--fs-heading);
    line-height:var(--lh-tight);
    margin:0;
  }

  /* ---------- Search box ---------- */
  .search-wrap{padding:4px 22px 18px;}
  .search-box{
    display:flex; align-items:center; gap:10px;
    background:var(--color-surface);
    border:1px solid var(--color-border);
    border-radius:var(--radius-pill);
    padding:14px 18px;
    box-shadow:0 1px 0 rgba(43,36,29,0.03);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .search-box:focus-within{border-color:var(--color-accent); box-shadow:0 0 0 3px var(--color-accent-soft);}
  .search-box svg{flex-shrink:0;}
  .search-box input{
    border:none; outline:none; background:transparent;
    font-size:var(--fs-body); font-weight:var(--weight-regular); font-family:var(--font-family); color:var(--color-text);
    flex:1; min-width:0;
  }
  .search-box input::placeholder{color:var(--color-text-soft);}

  .section-label{padding:0 22px 12px; font-size:var(--fs-caption); font-weight:var(--weight-regular); color:var(--color-text-soft);}

  /* ---------- 找食譜：頂層選擇畫面 ---------- */
  .find-choice-list{padding:8px 22px 20px; display:flex; flex-direction:column; gap:14px;}
  .find-choice-btn{
    display:flex; align-items:center; gap:16px; width:100%;
    padding:22px 20px; border-radius:var(--radius-lg);
    border:1px solid var(--color-border); background:var(--color-surface);
    cursor:pointer; -webkit-tap-highlight-color:transparent;
    font-family:var(--font-family); text-align:left;
    transition:transform .1s ease, border-color .12s ease;
  }
  .find-choice-btn:active{transform:scale(0.98);}
  .find-choice-icon{font-size:32px; flex-shrink:0;}
  .find-choice-body{display:flex; flex-direction:column; gap:4px;}
  .find-choice-title{font-size:var(--fs-card-title); font-weight:var(--weight-bold); color:var(--color-text);}
  .find-choice-desc{font-size:var(--fs-caption); font-weight:var(--weight-regular); color:var(--color-text-soft);}

  /* ---------- Category chips ---------- */
  .chip-row{
    display:flex; gap:8px;
    padding:0 22px 18px;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .chip-row::-webkit-scrollbar{display:none;}
  .chip{
    flex-shrink:0;
    padding:8px 16px;
    border-radius:var(--radius-pill);
    border:1px solid var(--color-border);
    background:var(--color-surface);
    color:var(--color-text-soft);
    font-size:var(--fs-caption);
    font-weight:var(--weight-medium);
    font-family:var(--font-family);
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition:background .12s ease, color .12s ease, border-color .12s ease;
  }
  .chip.active{
    background:var(--color-accent);
    border-color:var(--color-accent);
    color:#FBF3EE;
  }

  .app-version{
    text-align:center; padding:20px 22px 12px; margin:0;
    font-size:var(--fs-label); font-weight:var(--weight-regular); color:var(--color-text-soft); opacity:0.6;
  }

  /* ---------- 設定頁 ---------- */
  .settings-list{padding:0 22px; display:flex; flex-direction:column; gap:10px;}
  .settings-row{
    display:flex; align-items:center; gap:14px; width:100%;
    padding:16px; border-radius:var(--radius-lg);
    background:var(--color-surface); border:1px solid var(--color-border);
    cursor:pointer; -webkit-tap-highlight-color:transparent; font-family:var(--font-family); text-align:left;
  }
  .settings-row-icon{font-size:20px; flex-shrink:0;}
  .settings-row-label{font-size:var(--fs-body); font-weight:var(--weight-semibold); color:var(--color-text);}
  .settings-row.danger .settings-row-label{color:var(--color-accent-dark);}
  .settings-row.admin{background:var(--color-accent-soft); border-color:var(--color-accent);}

  /* ---------- 訂閱管理後台 ---------- */
  .admin-actions-row{display:flex; gap:10px; padding:0 22px 14px;}
  .admin-action-btn{
    flex:1; padding:12px; border-radius:var(--radius-md); border:1px solid var(--color-border);
    background:var(--color-jade-soft); color:var(--color-jade);
    font-size:var(--fs-caption); font-weight:var(--weight-semibold); font-family:var(--font-family);
    cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .admin-action-btn.warn{background:var(--color-accent-soft); color:var(--color-accent-dark);}
  .admin-action-btn.warn.active{background:var(--color-accent); color:#FBF3EE;}
  .admin-card{
    margin:0 22px 14px; padding:16px; border-radius:var(--radius-lg);
    background:var(--color-surface); border:1px solid var(--color-border);
  }
  .admin-card-email{font-size:var(--fs-body); font-weight:var(--weight-bold); margin:0 0 6px; word-break:break-all;}
  .admin-card-meta{font-size:var(--fs-label); font-weight:var(--weight-regular); color:var(--color-text-soft); margin:0 0 4px;}
  .admin-status{font-weight:var(--weight-semibold);}
  .admin-status.expired{color:var(--color-accent-dark);}
  .admin-status.disabled{color:var(--color-text-soft);}
  .admin-status.active{color:var(--color-jade);}
  .admin-card-actions{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px;}
  .admin-card-btn{
    padding:9px 12px; border-radius:var(--radius-pill); border:1px solid var(--color-border);
    background:var(--color-bg); color:var(--color-text-soft);
    font-size:var(--fs-label); font-weight:var(--weight-medium); font-family:var(--font-family);
    cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .admin-card-btn.disable{color:var(--color-accent-dark); border-color:var(--color-accent);}
  .admin-card-btn.enable{color:var(--color-jade); border-color:var(--color-jade);}
  .admin-card-btn.delete{margin-top:8px; width:100%; text-align:center; color:var(--color-accent-dark); border-color:var(--color-accent);}

  /* SOP完成畫面：這次要煮同步提示 */
  .sop-done-menu-note{
    font-size:var(--fs-caption); font-weight:var(--weight-regular); color:var(--color-text-soft);
    margin:-14px 0 22px; display:none;
  }


  /* ---------- Dish result cards ---------- */
  .result-list{padding:0 22px; display:flex; flex-direction:column; gap:12px;}
  .dish-card{
    display:flex; align-items:center; gap:14px;
    background:var(--color-surface);
    border:1px solid var(--color-border);
    border-radius:var(--radius-lg);
    padding:16px;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition:transform .12s ease;
  }
  .dish-card:active{transform:scale(0.98);}
  .dish-card-emoji{
    width:48px; height:48px; border-radius:12px;
    background:var(--color-accent-soft);
    display:flex; align-items:center; justify-content:center;
    font-size:22px; flex-shrink:0;
  }
  .dish-card-body{flex:1; min-width:0;}
  .dish-card-name{font-size:var(--fs-card-title); font-weight:var(--weight-bold); line-height:var(--lh-tight); margin:0 0 4px;}
  .dish-card-meta{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .tag{
    font-size:var(--fs-caption); font-weight:var(--weight-regular); color:var(--color-text-soft);
    background:var(--color-bg); padding:3px 9px; border-radius:var(--radius-pill);
  }
  .empty-state{
    padding:60px 30px; text-align:center; color:var(--color-text-soft); font-size:var(--fs-body); font-weight:var(--weight-regular); line-height:var(--lh-base);
  }

  /* ---------- Detail page ---------- */
  .detail-hero{padding:4px 22px 16px;}
  .detail-name{
    font-weight:var(--weight-bold); font-size:var(--fs-card-title); line-height:var(--lh-tight); margin:0 0 8px;
  }
  .detail-tags{display:flex; gap:8px; flex-wrap:wrap;}

  .stat-grid{
    margin:16px 22px 0;
    display:grid; grid-template-columns:repeat(2,1fr);
    background:var(--color-surface); border:1px solid var(--color-border);
    border-radius:var(--radius-lg); overflow:hidden;
  }
  .stat-cell{
    padding:14px 8px; text-align:center;
    border-right:1px solid var(--color-border);
  }
  .stat-cell:last-child{border-right:none;}
  .stat-value{font-size:var(--fs-body); font-weight:var(--weight-semibold); margin:0;}
  .stat-label{font-size:var(--fs-label); font-weight:var(--weight-regular); color:var(--color-text-soft); margin:2px 0 0;}

  .servings-card{
    margin:12px 22px 0;
    background:var(--color-surface); border:1px solid var(--color-border);
    border-radius:var(--radius-lg); padding:16px 18px;
  }
  .servings-header{
    display:flex; align-items:center; gap:8px;
    font-size:var(--fs-section); font-weight:var(--weight-bold); margin-bottom:12px;
  }
  .servings-control{
    display:flex; align-items:center; justify-content:center; gap:22px;
    margin-bottom:12px;
  }
  .serv-btn{
    width:40px; height:40px; border-radius:50%;
    border:1px solid var(--color-border); background:var(--color-bg);
    font-size:20px; font-weight:var(--weight-bold); color:var(--color-accent);
    cursor:pointer; -webkit-tap-highlight-color:transparent;
    transition:transform .1s ease;
  }
  .serv-btn:active{transform:scale(0.9);}
  .servings-value{font-size:var(--fs-card-title); font-weight:var(--weight-bold); min-width:76px; text-align:center;}
  .servings-quick{display:flex; gap:8px; justify-content:center; flex-wrap:wrap;}
  .serv-chip{
    padding:7px 14px; border-radius:var(--radius-pill);
    border:1px solid var(--color-border); background:var(--color-surface);
    font-size:var(--fs-caption); font-weight:var(--weight-medium); font-family:var(--font-family); color:var(--color-text-soft);
    cursor:pointer; -webkit-tap-highlight-color:transparent;
    transition:background .12s ease, color .12s ease, border-color .12s ease;
  }
  .serv-chip.active{background:var(--color-accent); border-color:var(--color-accent); color:#FBF3EE;}

  .rice-card{
    background:var(--color-surface); border:1px solid var(--color-border);
    border-radius:var(--radius-md); overflow:hidden;
  }
  .rice-row{
    display:flex; justify-content:space-between; gap:12px;
    padding:11px 14px; font-size:var(--fs-body); font-weight:var(--weight-regular);
    border-bottom:1px solid var(--color-border);
  }
  .rice-row:last-child{border-bottom:none;}
  .rice-row span:first-child{color:var(--color-text-soft); flex-shrink:0;}
  .rice-row span:last-child{text-align:right;}

  /* ---------- 料理 SOP 模式（全螢幕獨立畫面）---------- */
  .sop-overlay{
    position:fixed; inset:0; background:var(--color-bg);
    z-index:50; display:none;
  }
  .sop-overlay.active{display:flex; flex-direction:column;}
  .sop-inner{
    max-width:480px; margin:0 auto; width:100%; height:100%;
    display:flex; flex-direction:column; position:relative;
  }

  .sop-topbar{display:flex; align-items:flex-start; gap:12px; padding:18px 20px 6px;}
  .sop-close{
    width:36px; height:36px; border-radius:50%; flex-shrink:0;
    border:1px solid var(--color-border); background:var(--color-surface);
    font-size:19px; line-height:1; color:var(--color-text-soft);
    cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .sop-title-group{flex:1; min-width:0;}
  .sop-dish-name{font-weight:var(--weight-bold); font-size:var(--fs-card-title); margin:6px 0 0;}
  .sop-step-count{font-size:14px; font-weight:var(--weight-semibold); color:var(--color-text-soft); margin:3px 0 0;}

  .sop-progress{display:flex; gap:6px; padding:14px 20px 6px;}
  .sop-dot{flex:1; height:6px; border-radius:3px; background:var(--color-border);}
  .sop-dot.filled{background:var(--color-accent);}

  .sop-content{
    flex:1; display:flex; flex-direction:column; justify-content:center;
    padding:10px 26px; text-align:center; overflow-y:auto;
  }
  .sop-badges{display:flex; gap:10px; justify-content:center; margin-bottom:20px; flex-wrap:wrap;}
  .sop-badge{
    font-size:16px; font-weight:var(--weight-medium); padding:8px 16px;
    border-radius:var(--radius-pill); background:var(--color-accent-soft); color:var(--color-accent-dark);
  }
  .sop-badge.time{background:var(--color-jade-soft); color:var(--color-jade);}
  .sop-desc{font-size:22px; line-height:var(--lh-base); font-weight:var(--weight-semibold); margin:0;}
  .sop-tip{
    margin-top:24px; background:var(--color-jade-soft); color:var(--color-text);
    padding:14px 16px; border-radius:var(--radius-md); font-size:14px; font-weight:var(--weight-regular); line-height:var(--lh-base); text-align:left;
  }

  .sop-actions{display:flex; gap:12px; padding:16px 20px calc(20px + env(safe-area-inset-bottom));}
  .sop-btn{
    flex:1; padding:17px; border-radius:var(--radius-lg);
    font-size:var(--fs-body); font-weight:var(--weight-semibold); border:none; cursor:pointer;
    font-family:var(--font-family); -webkit-tap-highlight-color:transparent;
    transition:transform .1s ease;
  }
  .sop-btn.primary{background:var(--color-accent); color:#FBF3EE;}
  .sop-btn.secondary{background:var(--color-surface); border:1px solid var(--color-border); color:var(--color-text);}
  .sop-btn.danger{background:var(--color-accent); color:#FBF3EE;}
  .sop-btn:disabled{opacity:0.35; cursor:not-allowed;}
  .sop-btn:active:not(:disabled){transform:scale(0.97);}

  .sop-done-content{
    padding:56px 28px 40px; text-align:center;
    display:flex; flex-direction:column; align-items:center;
  }
  .sop-done-emoji{font-size:46px; margin:0;}
  .sop-done-title{font-size:var(--fs-heading); font-weight:var(--weight-bold); line-height:var(--lh-tight); margin:8px 0 2px;}
  .sop-done-dish{font-size:var(--fs-card-title); font-weight:var(--weight-bold); margin:0 0 26px;}

  .sop-rating-block{
    width:100%; background:var(--color-surface); border:1px solid var(--color-border);
    border-radius:var(--radius-lg); padding:20px; margin-bottom:18px; text-align:left;
  }
  .sop-rating-label{font-size:var(--fs-body); font-weight:var(--weight-semibold); margin:0 0 12px; text-align:center;}
  .sop-stars{display:flex; gap:8px; justify-content:center; font-size:30px; margin-bottom:14px; cursor:pointer;}
  .sop-star{color:var(--color-border); transition:color .1s ease;}
  .sop-star.filled{color:var(--color-accent);}
  .sop-note-input{
    width:100%; min-height:64px; border:1px solid var(--color-border); border-radius:var(--radius-sm);
    padding:10px 12px; font-family:var(--font-family); font-size:var(--fs-body); font-weight:var(--weight-regular); resize:vertical;
    margin-bottom:14px; background:var(--color-bg); color:var(--color-text); box-sizing:border-box;
  }
  .sop-done-exit{
    background:none; border:none; color:var(--color-text-soft); font-size:var(--fs-caption); font-weight:var(--weight-regular);
    text-decoration:underline; cursor:pointer; padding:8px; font-family:var(--font-family);
  }

  .sop-modal-backdrop{
    position:fixed; inset:0; background:rgba(43,36,29,0.5);
    display:none; align-items:center; justify-content:center; z-index:60; padding:24px;
  }
  .sop-modal{background:var(--color-surface); border-radius:var(--radius-lg); padding:24px; max-width:340px; width:100%;}
  .sop-modal-title{font-size:var(--fs-card-title); font-weight:var(--weight-bold); margin:0 0 18px; text-align:center;}
  .sop-modal-actions{display:flex; gap:10px;}

  /* ---------- 我有食材 ---------- */
  .ingredients-headline{padding:20px 22px 4px; font-size:var(--fs-heading); font-weight:var(--weight-bold); line-height:var(--lh-tight); margin:0;}

  .my-ingredients-bar{padding:16px 22px 4px;}
  .my-ingredients-label{font-size:var(--fs-caption); font-weight:var(--weight-regular); color:var(--color-text-soft); margin:0 0 8px;}
  .clear-row{display:flex; align-items:center; justify-content:space-between; padding:0 22px 8px; gap:12px;}
  .clear-row .my-ingredients-label{padding:0; margin:0;}
  .clear-link-btn{
    flex-shrink:0; background:none; border:none; padding:0;
    color:var(--color-text-soft); font-size:var(--fs-caption); font-weight:var(--weight-medium);
    text-decoration:underline; cursor:pointer; font-family:var(--font-family);
  }
  .my-ingredients-bar .clear-row{padding-left:0; padding-right:0;}
  .my-ingredients-empty{font-size:var(--fs-caption); font-weight:var(--weight-regular); color:var(--color-text-soft); margin:0 0 4px;}
  .my-ingredients-chips{display:flex; flex-wrap:wrap; gap:8px;}
  .my-ing-chip{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--color-accent-soft); color:var(--color-accent-dark);
    padding:8px 12px; border-radius:var(--radius-pill); font-size:var(--fs-caption); font-weight:var(--weight-medium);
    cursor:pointer; -webkit-tap-highlight-color:transparent; border:none; font-family:var(--font-family);
  }
  .my-ing-chip .remove-x{font-weight:var(--weight-bold);}

  /* 分類按鈕（landing 畫面的主要操作） */
  .ingredient-category-grid{
    display:grid; grid-template-columns:repeat(2,1fr); gap:12px;
    padding:4px 22px 20px;
  }
  .ingredient-category-btn{
    display:flex; align-items:center; gap:10px;
    padding:18px 16px; border-radius:var(--radius-lg);
    border:1px solid var(--color-border); background:var(--color-surface);
    cursor:pointer; -webkit-tap-highlight-color:transparent; font-family:var(--font-family);
    transition:transform .1s ease;
  }
  .ingredient-category-btn:active{transform:scale(0.97);}
  .ingredient-category-icon{font-size:26px;}
  .ingredient-category-name{font-size:var(--fs-body); font-weight:var(--weight-semibold); color:var(--color-text);}

  /* 食材勾選清單（分類詳細頁／搜尋結果共用） */
  .ing-check-list{display:flex; flex-direction:column; gap:8px; padding:4px 22px 8px;}
  .ing-check-row{
    display:flex; align-items:center; gap:12px; width:100%;
    padding:14px 16px; border-radius:var(--radius-md);
    border:1px solid var(--color-border); background:var(--color-surface);
    cursor:pointer; -webkit-tap-highlight-color:transparent;
    font-family:var(--font-family); text-align:left;
    transition:background .12s ease, border-color .12s ease;
  }
  .ing-check-row.selected{background:var(--color-jade-soft); border-color:var(--color-jade);}
  .ing-check-box{font-size:18px; flex-shrink:0; color:var(--color-text-soft);}
  .ing-check-row.selected .ing-check-box{color:var(--color-jade);}
  .ing-check-icon{font-size:20px; flex-shrink:0;}
  .ing-check-name{font-size:var(--fs-body); font-weight:var(--weight-medium); color:var(--color-text);}
  .ing-stock-hint{
    margin-left:auto; flex-shrink:0; font-size:var(--fs-label); font-weight:var(--weight-medium);
    color:var(--color-jade); background:var(--color-jade-soft); padding:3px 9px; border-radius:var(--radius-pill);
  }

  /* 固定於畫面底部的主要按鈕（各食材選擇畫面共用） */
  .ingredients-cta-wrap{padding:24px 22px 8px;}
  .ingredients-cta-btn{
    width:100%; padding:16px; border:none; border-radius:var(--radius-lg);
    background:var(--color-accent); color:#FBF3EE;
    font-size:var(--fs-body); font-weight:var(--weight-semibold); font-family:var(--font-family);
    cursor:pointer; -webkit-tap-highlight-color:transparent;
    transition:transform .12s ease;
  }
  .ingredients-cta-btn:disabled{opacity:0.35; cursor:not-allowed;}
  .ingredients-cta-btn:active:not(:disabled){transform:scale(0.98);}

  .ingredient-empty-state{padding:56px 30px; text-align:center;}
  .ingredient-empty-emoji{font-size:40px; margin:0 0 10px;}
  .ingredient-empty-title{font-size:var(--fs-body); font-weight:var(--weight-semibold); margin:0 0 16px;}
  .ingredient-empty-desc{font-size:var(--fs-caption); font-weight:var(--weight-regular); color:var(--color-text-soft); margin:0;}

  .match-badge{
    display:inline-block; font-size:var(--fs-label); font-weight:var(--weight-semibold);
    padding:4px 10px; border-radius:var(--radius-pill); margin-top:8px;
  }
  .match-badge.ok{background:var(--color-jade-soft); color:var(--color-jade);}
  .match-badge.mid{background:var(--color-accent-soft); color:var(--color-accent-dark);}
  .match-badge.low{background:var(--color-bg); color:var(--color-text-soft); border:1px solid var(--color-border);}
  .match-missing{font-size:var(--fs-label); font-weight:var(--weight-regular); color:var(--color-text-soft); margin:4px 0 0;}

  /* ---------- 搜尋找不到時的空狀態（找料理/我有食材共用）---------- */
  .ai-empty-state{padding:44px 30px 40px;}
  .ai-empty-title{font-size:var(--fs-body); font-weight:var(--weight-semibold); color:var(--color-text); margin:0 0 16px;}
  .ai-empty-desc{font-size:var(--fs-caption); font-weight:var(--weight-regular); color:var(--color-text-soft); margin:14px 0 0;}

  /* ---------- 文字輸入/送出按鈕（手動新增採購項目共用）---------- */
  .ai-name-input{
    width:100%; box-sizing:border-box; padding:14px 16px;
    border:1px solid var(--color-border); border-radius:var(--radius-md);
    font-size:var(--fs-body); font-weight:var(--weight-medium); font-family:var(--font-family);
    color:var(--color-text); background:var(--color-surface); margin-bottom:10px;
  }
  .ai-name-input:focus{outline:none; border-color:var(--color-accent);}
  .ai-generate-btn{
    width:100%; padding:16px; border:none; border-radius:var(--radius-lg);
    background:var(--color-accent); color:#FBF3EE;
    font-size:var(--fs-body); font-weight:var(--weight-semibold); font-family:var(--font-family);
    cursor:pointer; -webkit-tap-highlight-color:transparent;
    transition:transform .12s ease;
  }
  .ai-generate-btn:active{transform:scale(0.98);}

  /* ---------- 我的菜單 ---------- */
  .menu-headline{padding:20px 22px 4px; font-size:var(--fs-heading); font-weight:var(--weight-bold); line-height:var(--lh-tight); margin:0;}
  .menu-subtitle{padding:2px 22px 4px; font-size:var(--fs-caption); font-weight:var(--weight-regular); color:var(--color-text-soft); margin:0;}
  .menu-list{padding:16px 22px; display:flex; flex-direction:column; gap:12px;}
  .menu-card{
    background:var(--color-surface); border:1px solid var(--color-border);
    border-radius:var(--radius-lg); padding:16px;
  }
  .menu-card-head{display:flex; align-items:center; gap:12px;}
  .menu-card-remove-btn{
    flex-shrink:0; width:28px; height:28px; border-radius:50%;
    border:1px solid var(--color-border); background:var(--color-bg); color:var(--color-text-soft);
    font-size:14px; cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .menu-card-emoji{
    width:44px; height:44px; border-radius:12px; flex-shrink:0;
    background:var(--color-accent-soft); display:flex; align-items:center; justify-content:center; font-size:20px;
  }
  .menu-card-body{flex:1; min-width:0;}
  .menu-card-name{font-size:var(--fs-card-title); font-weight:var(--weight-bold); margin:0 0 4px;}
  .menu-card-meta{font-size:var(--fs-caption); font-weight:var(--weight-regular); color:var(--color-text-soft);}
  .menu-card-servings{
    display:flex; align-items:center; justify-content:center; gap:16px;
    margin-top:14px; padding-top:14px; border-top:1px solid var(--color-border);
  }
  .menu-serv-btn{
    width:32px; height:32px; border-radius:50%; border:1px solid var(--color-border);
    background:var(--color-bg); color:var(--color-accent); font-size:16px; font-weight:var(--weight-bold);
    cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .menu-serv-value{font-size:var(--fs-body); font-weight:var(--weight-semibold); min-width:56px; text-align:center;}

  .meal-chip-row{display:flex; gap:8px; margin-top:12px;}
  .meal-chip{
    flex:1; padding:8px 4px; border-radius:var(--radius-md);
    border:1px solid var(--color-border); background:var(--color-bg); color:var(--color-text-soft);
    font-size:var(--fs-label); font-weight:var(--weight-medium); font-family:var(--font-family);
    cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .meal-chip.active{background:var(--color-accent-soft); border-color:var(--color-accent); color:var(--color-accent-dark);}

  .selected-menu-start-btn{
    display:block; width:100%; margin-top:14px; padding:13px;
    border:none; border-radius:var(--radius-md); background:var(--color-accent); color:#FBF3EE;
    font-size:var(--fs-body); font-weight:var(--weight-semibold); font-family:var(--font-family);
    cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .selected-menu-start-btn:active{transform:scale(0.98);}
  .selected-menu-card-actions{
    display:flex; gap:8px; margin-top:14px; padding-top:14px; border-top:1px solid var(--color-border);
  }
  .selected-menu-action-btn{
    flex:1; padding:10px; border-radius:var(--radius-md); border:1px solid var(--color-border);
    background:var(--color-bg); color:var(--color-text); font-size:var(--fs-caption); font-weight:var(--weight-medium);
    font-family:var(--font-family); cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .selected-menu-action-btn.complete{border-color:var(--color-jade); color:var(--color-jade); background:var(--color-jade-soft);}
  .selected-menu-action-btn.remove{border-color:var(--color-accent); color:var(--color-accent-dark); background:var(--color-accent-soft);}

  .menu-empty-state{padding:60px 30px; text-align:center;}
  .menu-empty-emoji{font-size:40px; margin:0 0 10px;}
  .menu-empty-title{font-size:var(--fs-body); font-weight:var(--weight-semibold); margin:0 0 6px;}
  .menu-empty-desc{font-size:var(--fs-caption); font-weight:var(--weight-regular); color:var(--color-text-soft); margin:0;}

  .menu-cta-wrap{padding:8px 22px 24px;}
  .menu-cta-btn{
    width:100%; padding:16px; border:none; border-radius:var(--radius-lg);
    background:var(--color-accent); color:#FBF3EE;
    font-size:var(--fs-body); font-weight:var(--weight-semibold); font-family:var(--font-family);
    cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .menu-cta-btn:disabled{opacity:0.35; cursor:not-allowed;}
  .menu-cta-btn:active:not(:disabled){transform:scale(0.98);}
  .menu-cta-hint{padding:0 22px 20px; font-size:var(--fs-caption); font-weight:var(--weight-regular); color:var(--color-text-soft); text-align:center;}

  /* ---------- 購物清單 ---------- */
  .shopping-actions-row{display:flex; flex-wrap:wrap; gap:16px; padding:0 22px 14px;}
  .shopping-action-link{
    background:none; border:none; padding:0;
    color:var(--color-accent-dark); font-size:var(--fs-caption); font-weight:var(--weight-semibold);
    text-decoration:underline; cursor:pointer; font-family:var(--font-family);
  }
  .manual-add-form{padding:0 22px 18px; display:flex; flex-direction:column; gap:10px;}
  .manual-category-label{font-size:var(--fs-caption); font-weight:var(--weight-regular); color:var(--color-text-soft); margin:0;}
  .manual-category-row{padding:0; flex-wrap:wrap; overflow-x:visible;}
  .shopping-group{padding:0 22px 20px;}
  .shopping-group-title{
    font-size:var(--fs-section); font-weight:var(--weight-bold); margin:0 0 10px;
    display:flex; align-items:center; gap:8px;
  }
  .shopping-done-toggle{
    display:flex; align-items:center; justify-content:space-between; width:calc(100% - 44px);
    margin:0 22px 16px; padding:13px 16px; border-radius:var(--radius-md);
    border:1px solid var(--color-border); background:var(--color-jade-soft);
    color:var(--color-jade); font-size:var(--fs-body); font-weight:var(--weight-medium);
    font-family:var(--font-family); cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .shopping-done-arrow{font-size:11px;}
  .shopping-item-list{display:flex; flex-direction:column; gap:8px;}
  .shopping-item-row{
    display:flex; align-items:center; gap:8px; width:100%;
    border-radius:var(--radius-md);
    border:1px solid var(--color-border); background:var(--color-surface);
  }
  .shopping-item-row.checked{background:var(--color-bg); border-color:var(--color-border);}
  .shopping-item-row.seasoning{border-left:4px solid var(--color-accent);}
  .shopping-item-toggle{
    display:flex; align-items:center; gap:12px; flex:1; min-width:0;
    padding:13px 16px; border:none; background:none;
    cursor:pointer; -webkit-tap-highlight-color:transparent;
    font-family:var(--font-family); text-align:left;
  }
  .shopping-item-box{font-size:18px; flex-shrink:0; color:var(--color-text-soft);}
  .shopping-item-row.checked .shopping-item-box{color:var(--color-jade);}
  .shopping-item-name{flex:1; font-size:var(--fs-body); font-weight:var(--weight-medium); color:var(--color-text);}
  .shopping-item-row.seasoning .shopping-item-name{color:var(--color-accent-dark);}
  .shopping-item-row.checked .shopping-item-name{color:var(--color-text-soft); text-decoration:line-through;}
  .shopping-item-amount{font-size:var(--fs-caption); font-weight:var(--weight-regular); color:var(--color-text-soft); flex-shrink:0;}
  .shopping-item-delete{
    flex-shrink:0; width:32px; height:32px; margin-right:8px; border-radius:50%;
    border:1px solid var(--color-border); background:var(--color-bg); color:var(--color-text-soft);
    font-size:14px; cursor:pointer; -webkit-tap-highlight-color:transparent;
  }

  .shopping-empty-state{padding:60px 30px; text-align:center;}
  .shopping-empty-emoji{font-size:40px; margin:0 0 10px;}
  .shopping-empty-title{font-size:var(--fs-body); font-weight:var(--weight-semibold); margin:0 0 6px;}
  .shopping-empty-desc{font-size:var(--fs-caption); font-weight:var(--weight-regular); color:var(--color-text-soft); margin:0;}


  .detail-section{padding:26px 22px 0;}
  .detail-section-title{
    font-size:var(--fs-section); font-weight:var(--weight-bold); margin:0 0 12px;
    display:flex; align-items:center; gap:8px;
  }

  .subgroup-label{font-size:var(--fs-label); font-weight:var(--weight-medium); color:var(--color-text-soft); margin:14px 0 8px;}
  .subgroup-label:first-child{margin-top:0;}

  .ingredient-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px;}
  .ingredient-row{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--color-surface); border:1px solid var(--color-border);
    border-radius:var(--radius-sm); padding:10px 14px; font-size:var(--fs-body); font-weight:var(--weight-medium);
  }
  .ingredient-row-right{display:flex; align-items:center; gap:10px;}
  .ingredient-amount{color:var(--color-text-soft); font-size:var(--fs-caption); font-weight:var(--weight-regular);}

  .detail-phase-back{
    display:block; margin:18px 22px 4px; padding:0; background:none; border:none;
    color:var(--color-text-soft); font-size:var(--fs-caption); font-weight:var(--weight-medium);
    cursor:pointer; -webkit-tap-highlight-color:transparent; font-family:var(--font-family);
  }

  .tool-tags{display:flex; gap:8px; flex-wrap:wrap;}
  .tool-tag{
    font-size:var(--fs-caption); font-weight:var(--weight-regular); background:var(--color-jade-soft); color:var(--color-jade);
    padding:6px 12px; border-radius:var(--radius-pill);
  }

  .step-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px;}
  .prep-step{
    display:flex; gap:10px; align-items:flex-start;
    background:var(--color-surface); border:1px solid var(--color-border);
    border-radius:var(--radius-sm); padding:12px 14px; font-size:var(--fs-body); font-weight:var(--weight-regular); line-height:var(--lh-loose);
  }
  .step-num{
    width:22px; height:22px; border-radius:50%; background:var(--color-bg);
    color:var(--color-text-soft); font-size:var(--fs-label); font-weight:var(--weight-bold);
    display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px;
  }

  .cook-step{
    background:var(--color-surface); border:1px solid var(--color-border);
    border-radius:var(--radius-md); padding:14px 16px;
  }
  .cook-step-head{display:flex; align-items:center; gap:10px; margin-bottom:6px;}
  .cook-step-num{
    width:24px; height:24px; border-radius:50%; background:var(--color-accent);
    color:#FBF3EE; font-size:var(--fs-label); font-weight:var(--weight-bold);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .cook-step-badges{display:flex; gap:6px; margin-left:auto;}
  .badge{font-size:var(--fs-label); font-weight:var(--weight-medium); padding:3px 9px; border-radius:var(--radius-pill); background:var(--color-bg); color:var(--color-text-soft);}
  .cook-step-desc{font-size:var(--fs-body); font-weight:var(--weight-regular); line-height:var(--lh-loose); margin:0;}

  .note-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px;}
  .note-item{
    display:flex; gap:10px; align-items:flex-start;
    font-size:var(--fs-body); font-weight:var(--weight-regular); line-height:var(--lh-base); padding:12px 14px;
    border-radius:var(--radius-sm);
  }
  .note-item.tip{background:var(--color-jade-soft); color:var(--color-text);}
  .note-item.mistake{background:var(--color-accent-soft); color:var(--color-text);}

  .start-cook-wrap{padding:28px 22px 8px;}
  .start-cook-btn{
    width:100%; padding:16px; border:none; border-radius:var(--radius-lg);
    background:var(--color-accent); color:#FBF3EE;
    font-size:var(--fs-body); font-weight:var(--weight-semibold); font-family:var(--font-family);
    cursor:pointer; -webkit-tap-highlight-color:transparent;
    transition:transform .12s ease;
  }
  .start-cook-btn:active{transform:scale(0.98);}
  .start-cook-btn.added{background:var(--color-jade-soft); color:var(--color-jade);}

  .add-to-menu-btn{
    width:100%; padding:16px; border:none; border-radius:var(--radius-lg);
    background:var(--color-jade); color:#FFFFFF;
    font-size:var(--fs-body); font-weight:var(--weight-semibold); font-family:var(--font-family);
    cursor:pointer; -webkit-tap-highlight-color:transparent;
    transition:transform .12s ease;
  }
  .add-to-menu-btn:active{transform:scale(0.98);}
  .add-to-menu-btn.added{background:var(--color-jade-soft); color:var(--color-jade);}

  .sop-secondary-btn{
    width:100%; padding:13px; border:1px solid var(--color-border); border-radius:var(--radius-lg);
    background:var(--color-surface); color:var(--color-text-soft);
    font-size:var(--fs-caption); font-weight:var(--weight-medium); font-family:var(--font-family);
    cursor:pointer; -webkit-tap-highlight-color:transparent;
    transition:transform .12s ease;
  }
  .sop-secondary-btn:active{transform:scale(0.98);}

  /* ---------- Bottom nav ---------- */
  .bottom-nav{
    position:fixed; left:0; right:0; bottom:0;
    max-width:480px; margin:0 auto;
    background:var(--color-surface); border-top:1px solid var(--color-border);
    display:flex; padding:8px 4px calc(10px + env(safe-area-inset-bottom));
    z-index:10;
  }
  .nav-item{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
    padding:6px 0; background:none; border:none; color:var(--color-text-soft);
    font-family:var(--font-family); font-size:var(--fs-label); font-weight:var(--weight-regular); cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .nav-item svg{width:22px; height:22px;}
  .nav-item.active{color:var(--color-accent);}
  .nav-item:active{opacity:0.6;}

  .toast{
    position:fixed; left:50%; bottom:96px;
    transform:translateX(-50%) translateY(12px);
    background:var(--color-text); color:#FBF3EE;
    padding:11px 20px; border-radius:var(--radius-pill); font-size:var(--fs-caption); font-weight:var(--weight-regular);
    opacity:0; pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    z-index:20; white-space:nowrap;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* ---------- 登入頁 ---------- */
  #login{
    position:fixed; inset:0; z-index:1000;
    display:flex; align-items:center; justify-content:center;
    background:var(--color-bg); padding:24px;
  }
  .login-card{
    width:100%; max-width:360px; background:var(--color-surface);
    border:1px solid var(--color-border); border-radius:var(--radius-lg);
    padding:32px 26px; text-align:center;
  }
  .login-logo-img{width:88px; height:auto; display:block; margin:0 auto 12px;}
  .login-title{font-size:var(--fs-title); font-weight:var(--weight-bold); color:var(--color-text); margin:0 0 6px;}
  .login-desc{font-size:var(--fs-caption); font-weight:var(--weight-regular); color:var(--color-text-soft); margin:0 0 20px;}
  .code-input{
    width:100%; padding:14px 16px; border-radius:var(--radius-md);
    border:1px solid var(--color-border); background:var(--color-bg);
    font-size:var(--fs-body); font-family:var(--font-family); color:var(--color-text);
    box-sizing:border-box;
  }
  .login-invite-toggle{
    font-size:var(--fs-label); color:var(--color-accent-dark); text-align:right;
    margin-top:8px; cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .login-invite-input{margin-top:10px;}
  .code-hint{
    margin-top:14px; padding:10px 12px; border-radius:var(--radius-md);
    background:var(--color-jade-soft); color:var(--color-jade);
    font-size:var(--fs-label); font-weight:var(--weight-medium);
  }
  .login-consent{
    display:flex; align-items:flex-start; gap:8px; margin-top:16px;
    font-size:var(--fs-label); color:var(--color-text-soft); text-align:left; line-height:var(--lh-base);
  }
  .login-consent input{margin-top:2px; flex-shrink:0;}
  .login-terms-link{color:var(--color-accent-dark); text-decoration:underline;}
  .btn-primary{
    width:100%; margin-top:20px; padding:14px; border:none; border-radius:var(--radius-lg);
    background:var(--color-accent); color:#FBF3EE;
    font-size:var(--fs-body); font-weight:var(--weight-semibold); font-family:var(--font-family);
    cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .btn-primary:disabled{opacity:0.6;}
  .login-msg{margin-top:12px; font-size:var(--fs-label); color:var(--color-accent-dark); min-height:16px; line-height:var(--lh-base);}

  /* ---------- 彈窗 sheet（裝置上限／試用歡迎／到期提醒） ---------- */
  .overlay{
    position:fixed; inset:0; z-index:2000;
    background:rgba(43,36,29,0.45);
    display:flex; align-items:flex-end; justify-content:center;
  }
  .sheet{
    width:100%; max-width:420px; background:var(--color-surface);
    border-radius:var(--radius-lg) var(--radius-lg) 0 0;
    max-height:85vh; overflow-y:auto;
  }

  /* ---------- 服務條款彈窗 ---------- */
  .terms-sheet{border-radius:20px; max-width:420px; margin:0 16px; padding:26px 22px; max-height:85vh;}
  .terms-logo-img{display:block; width:64px; height:auto; margin:0 auto 10px;}

<script>
  /* =========================================================
     Firebase 初始化 ／ 登入與帳號管理系統
     ---------------------------------------------------------
     用相容模式SDK（不是模組化SDK），因為底下這套登入邏輯
     整段沿用既有規格，維持 firebase.xxx() 全域物件的寫法。
     這套系統只負責「擋在App最外面判斷能不能進來」，通過後
     App本身所有資料（料理／這次要煮／採購／我的菜單...）
     還是跟以前一樣存在 localStorage，沒有被搬進Firebase。
     ========================================================= */
  const firebaseConfig = {
    apiKey: "AIzaSyBGfQ1oKOrt723tJ3w7LIwDLSh0nGwRF30",
    authDomain: "my-project-c89db.firebaseapp.com",
    databaseURL: "https://my-project-c89db-default-rtdb.firebaseio.com",
    projectId: "my-project-c89db",
    storageBucket: "my-project-c89db.firebasestorage.app",
    messagingSenderId: "301172719437",
    appId: "1:301172719437:web:c78a0ec43bcbf4eac38104"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  var auth = null;
  try{ auth = firebase.auth(); }catch(e){ console.error("Firebase 初始化失敗", e); }

  var state = { isAdmin:false, user:null, plan:null };

  // 通過登入驗證後，才真正顯示App、渲染內容——在這之前，
  // App所有資料在背景已經從localStorage讀好了（各功能
  // 自己的 loadXXX() 在宣告時就會跑），只是畫面還沒打開
  function enterApp(){
    document.getElementById('login').style.display = 'none';
    document.getElementById('appRoot').style.display = 'block';
    renderChips();
    renderResults();
  }

  const ADMIN_EMAIL = "mp65p@hotmail.com";

  const codeInput=document.getElementById("codeInput"), loginBtn=document.getElementById("loginBtn"), loginMsg=document.getElementById("loginMsg");
  loginBtn.addEventListener("click", doLogin);
  codeInput.addEventListener("keydown", e=>{ if(e.key==="Enter") doLogin(); });
  (function(){
    var t=document.getElementById("inviteToggle"), i=document.getElementById("inviteInput");
    if(t && i) t.addEventListener("click", function(){
      var open=i.style.display!=="none";
      i.style.display=open?"none":"";
      t.textContent=open?"有邀請碼嗎？":"收起邀請碼欄位";
      if(!open) i.focus();
    });
  })();

  function isEmail(s){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s); }
  function emailKey(e){ return String(e||"").toLowerCase().replace(/[.#$\[\]]/g,"_"); }
  var FAMILY_DEVICE_KEY="cal_role_family";
  function isFamilyDevice(){ try{ return localStorage.getItem(FAMILY_DEVICE_KEY)==="1"; }catch(e){ return false; } }
  function markDeviceRole(isFamily){ try{ localStorage.setItem(FAMILY_DEVICE_KEY, isFamily?"1":"0"); }catch(e){} }
  function genInviteCode(){ return String(Math.floor(100000+Math.random()*900000)); }
  async function createInviteCode(){
    if(!state.user || state.isAdmin) return null;
    var key=emailKey(state.user);
    var code=genInviteCode(), exp=Date.now()+30*60*1000;
    try{ await db.ref("subscribers/"+key+"/inviteCode").set({code:code, exp:exp}); }catch(e){ return null; }
    return { code:code, exp:exp };
  }
  async function verifyInviteCode(email, code){
    var key=emailKey(email);
    var snap;
    try{ snap=await db.ref("subscribers/"+key+"/inviteCode").once("value"); }catch(e){ return false; }
    var v=snap.val();
    if(!v || !v.code) return false;
    if(String(v.code)!==String(code).trim()) return false;
    if(Date.now() > Number(v.exp||0)) return false;
    try{ await db.ref("subscribers/"+key+"/inviteCode").remove(); }catch(e){}
    return true;
  }
  function userBase(){
    var u=state.user||"";
    if(isEmail(u)) return "users/"+emailKey(u)+"/";
    return "";
  }
  function uref(p){ return db.ref(userBase()+p); }
  async function getServerTime(){
    try{ var s=await db.ref(".info/serverTimeOffset").once("value"); return Date.now()+(s.val()||0); }
    catch(e){ return Date.now(); }
  }
  function _ymdTs(ts){ var d=new Date(ts); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

  function showDeviceLimit(email, plan, limit){
    var root=document.getElementById("modalRoot");
    var isFull=(plan==="full"||plan==="family");
    root.innerHTML=
      '<div class="overlay" id="ovl" style="align-items:center"><div class="sheet" id="sheet" style="border-radius:20px;max-width:400px;margin:0 16px;padding:24px 20px">'+
        '<div style="text-align:center;font-size:44px;line-height:1;margin-bottom:10px">📱</div>'+
        '<div style="text-align:center;font-size:19px;font-weight:900;color:#2E2E33">已達裝置上限</div>'+
        '<div style="text-align:center;font-size:13.5px;color:#8A8A93;margin-top:8px;line-height:1.7">您目前的方案可在 <b style="color:#E8735C">'+limit+' 台裝置</b>使用。<br>若要更換裝置或釋出名額，請透過官方 LINE 聯繫我們協助處理。</div>'+
        (isFull?'':'<div style="text-align:center;margin-top:16px;padding-top:16px;border-top:1px solid #EFEAE2"><div style="font-size:13px;color:#8A8A93;margin-bottom:10px">想和家人一起使用？</div>'+
        '<button id="dlUp" style="width:100%;border:none;background:#E8735C;color:#fff;border-radius:12px;padding:13px;font-size:15px;font-weight:800">升級家庭版，最多 3 人共用</button></div>')+
        '<button id="dlClose" style="width:100%;border:none;background:none;color:#8A8A93;font-size:13px;padding:12px;margin-top:6px">關閉</button>'+
      '</div></div>';
    var up=document.getElementById("dlUp");
    if(up) up.addEventListener("click", function(){ closeSheet(); });
    document.getElementById("dlClose").addEventListener("click", closeSheet);
  }
  function closeSheet(){ var r=document.getElementById("modalRoot"); if(r) r.innerHTML=""; }

  var DEV_KEY="cal_devid";
  function _devId(){
    var id; try{ id=localStorage.getItem(DEV_KEY); }catch(e){}
    if(!id){ id="d"+Date.now().toString(36)+Math.random().toString(36).slice(2,8); try{ localStorage.setItem(DEV_KEY,id); }catch(e){} }
    return id;
  }
  function _devName(){
    var ua=navigator.userAgent||"";
    var os=/iPhone|iPad/i.test(ua)?"iPhone":/Android/i.test(ua)?"Android":/Windows/i.test(ua)?"Windows":/Mac/i.test(ua)?"Mac":"裝置";
    return os;
  }
  function planDeviceLimit(plan){
    if(plan==="full"||plan==="family") return 3;
    if(plan==="trial") return 2;
    return 1;
  }
  async function checkDevice(email, plan){
    var key=emailKey(email), id=_devId(), now=Date.now();
    var limit=planDeviceLimit(plan);
    var snap;
    try{ snap=await db.ref("subscribers/"+key+"/devices").once("value"); }
    catch(e){ return {ok:true}; }
    var devs=snap.val()||{};
    var CUT=30*86400000, changed=false;
    Object.keys(devs).forEach(function(k){
      if(k!==id && devs[k] && devs[k].last && (now-devs[k].last)>CUT){ delete devs[k]; changed=true; }
    });
    if(changed){ try{ await db.ref("subscribers/"+key+"/devices").set(devs); }catch(e){} }
    if(devs[id]){
      var ids=Object.keys(devs);
      if(ids.length>limit){
        ids.sort(function(a,b){ return (devs[b].last||0)-(devs[a].last||0); });
        if(ids.slice(0,limit).indexOf(id)<0) return {ok:false, limit:limit, plan:plan};
      }
      try{ db.ref("subscribers/"+key+"/devices/"+id+"/last").set(now); }catch(e){}
      return {ok:true};
    }
    if(Object.keys(devs).length >= limit) return {ok:false, limit:limit, plan:plan};
    try{ await db.ref("subscribers/"+key+"/devices/"+id).set({ name:_devName(), last:now, first:now }); }catch(e){}
    try{ db.ref("subscribers/"+key+"/deviceLimit").set(limit); }catch(e){}
    return {ok:true};
  }
  async function verifyCustomer(email){
    var key=emailKey(email);
    var now=await getServerTime();
    var snap;
    try{ snap=await db.ref("subscribers/"+key).once("value"); }
    catch(e){ return { ok:true, plan: (localStorage.getItem("cal_plan")||"free") }; }
    var sub=snap.val();
    if(!sub){
      var expTs=now+21*86400000;
      var rec={ email:email, plan:"trial", expiry:_ymdTs(expTs), status:"active", deviceLimit:2, createdAt:now, lastSeen:now, devices:{} };
      try{ await db.ref("subscribers/"+key).set(rec); }catch(e){}
      return { ok:true, plan:"trial", expiry:rec.expiry, newTrial:true };
    }
    if(sub.status==="disabled") return { ok:false, msg:"此帳號已停用，請聯繫客服" };
    try{ db.ref("subscribers/"+key+"/lastSeen").set(now); }catch(e){}
    var expMs = sub.expiry ? Date.parse(sub.expiry+"T23:59:59") : 0;
    var expired = expMs && now>expMs;
    var effPlan = expired ? "free" : (sub.plan||"free");
    return { ok:true, plan:effPlan, expiry:sub.expiry, expired:!!expired };
  }

  function showInfoSheet(emoji, title, bodyHtml, btnText){
    var root=document.getElementById("modalRoot");
    root.innerHTML=
      '<div class="overlay" id="ovl" style="align-items:center"><div class="sheet" id="sheet" style="border-radius:20px;max-width:400px;margin:0 16px;padding:26px 22px;max-height:80vh;overflow-y:auto">'+
        '<div style="text-align:center;font-size:44px;line-height:1;margin-bottom:10px">'+emoji+'</div>'+
        '<div style="text-align:center;font-size:19px;font-weight:900;color:#2E2E33;margin-bottom:12px">'+title+'</div>'+
        '<div style="font-size:13.5px;color:#5A5A62;line-height:1.85">'+bodyHtml+'</div>'+
        '<button id="infoSheetOk" style="width:100%;border:none;background:#3E9B8E;color:#fff;border-radius:12px;padding:13px;font-size:15px;font-weight:800;margin-top:20px">'+(btnText||"知道了")+'</button>'+
      '</div></div>';
    document.getElementById("infoSheetOk").addEventListener("click", closeSheet);
  }

  // 登入頁「服務條款與隱私政策」連結——內容沿用智在生活

  async function finishCustomerLogin(email){
    loginBtn.disabled=true; loginBtn.textContent="驗證中…";
    var res;
    try{ res=await verifyCustomer(email); }catch(e){ res={ok:true,plan:"free"}; }
    loginBtn.disabled=false; loginBtn.textContent="登入";
    if(!res.ok){ loginMsg.textContent=res.msg||"無法登入，請聯繫客服"; return; }
    var _dev=await checkDevice(email, res.plan);
    if(!_dev.ok){ showDeviceLimit(email, res.plan, _dev.limit); return; }
    var _prevPlan; try{ _prevPlan=localStorage.getItem("cal_plan"); }catch(e){}
    state.isAdmin=false; state.user=email; state.plan=res.plan;
    localStorage.setItem(AUTH_KEY,email);
    try{ localStorage.setItem("cal_plan",res.plan); }catch(e){}
    if(res.newTrial){
      showTrialWelcome(res.expiry);
    } else if(res.expired && res.plan==="free" && _prevPlan && _prevPlan!=="free"){
      var _shownKey="cal_trialExpiredShown";
      var _already; try{ _already=localStorage.getItem(_shownKey); }catch(e){}
      if(_already!==res.expiry){ showTrialExpired(); try{ localStorage.setItem(_shownKey,res.expiry); }catch(e){} }
    } else if(_prevPlan && (_prevPlan==="trial"||_prevPlan==="free") && (res.plan==="basic"||res.plan==="full"||res.plan==="family")){
      showUpgradeSuccess(res.plan);
    }
    enterApp();
  }

  async function completeEmailLinkSignIn(){
    try{
      if(!auth || !auth.isSignInWithEmailLink(window.location.href)) return false;
    }catch(e){ return false; }
    var email; try{ email=localStorage.getItem("emailForSignIn"); }catch(e){}
    if(!email){ email=prompt("請輸入你登入時使用的 Email，以完成驗證："); }
    if(!email){ return false; }
    try{
      await auth.signInWithEmailLink(email, window.location.href);
      try{ localStorage.removeItem("emailForSignIn"); }catch(e){}
      try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
      try{ codeInput.value=email; }catch(e){}
      if(loginMsg) loginMsg.textContent="✅ 已驗證成功，請按下方「登入」進入";
      return false;
    }catch(e){
      if(loginMsg) loginMsg.textContent="😕 驗證連結無效或已過期，請重新登入。";
      try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
      return false;
    }
  }
  var _authReadyPromise=null;
  function waitAuthReady(){
    if(!auth) return Promise.resolve(null);
    if(_authReadyPromise) return _authReadyPromise;
    _authReadyPromise=new Promise(function(resolve){
      var unsub=auth.onAuthStateChanged(function(u){ try{ unsub(); }catch(e){} resolve(u); });
    });
    return _authReadyPromise;
  }
  async function doLogin(){
    loginMsg.textContent="";
    const input=codeInput.value.trim();
    if(!input){ loginMsg.textContent="請輸入 Email"; return; }
    var _agree=document.getElementById("agreeChk");
    if(_agree && !_agree.checked){ loginMsg.textContent="請先勾選同意服務條款與隱私政策"; return; }
    try{ localStorage.setItem("agreedTerms","1"); }catch(e){}
    if(!isEmail(input)){ loginMsg.textContent="Email 格式不正確"; return; }
    var _inviteEl=document.getElementById("inviteInput");
    var _invite=_inviteEl ? _inviteEl.value.trim() : "";
    if(_invite){
      loginBtn.disabled=true; loginBtn.textContent="驗證中…";
      var _ok=await verifyInviteCode(input, _invite);
      loginBtn.disabled=false; loginBtn.textContent="登入";
      if(!_ok){ loginMsg.textContent="😕 邀請碼錯誤或已過期，請確認代碼或請本人重新產生"; return; }
      markDeviceRole(true);
      await finishCustomerLogin(input);
      return;
    }
    var _fbUser = auth ? await waitAuthReady() : null;
    if(_fbUser && _fbUser.email && _fbUser.email.toLowerCase()===input.toLowerCase()){
      // 管理員Email也要先走過這道真正的Firebase驗證，通過後
      // 才標記管理員身分——不走訂閱/試用那套客戶邏輯，這樣
      // 管理員讀取subscribers/資料時，才符合資料庫規則要求的
      // 「auth != null」，不會被安全規則擋下來變成空白畫面
      if(input.toLowerCase()===ADMIN_EMAIL){
        state.isAdmin=true; state.user=input; state.plan="full";
        localStorage.setItem(AUTH_KEY,input);
        enterApp();
        return;
      }
      markDeviceRole(false);
      await finishCustomerLogin(input);
      return;
    }
    if(!auth){ loginMsg.textContent="驗證服務暫時無法使用，請稍後再試"; return; }
    loginBtn.disabled=true; loginBtn.textContent="寄送中…";
    try{
      var acs={ url: location.href.split('#')[0].split('?')[0], handleCodeInApp:true };
      await auth.sendSignInLinkToEmail(input, acs);
      try{ localStorage.setItem("emailForSignIn", input); }catch(e){}
      loginMsg.textContent="📧 登入連結已寄到 "+input+"，請到信箱點擊完成登入（找不到請看垃圾郵件夾）";
    }catch(e){
      loginMsg.textContent="寄送失敗："+((e&&e.message)?e.message:"請稍後再試");
    }
    loginBtn.disabled=false; loginBtn.textContent="登入";
  }

  function _startAppFlow(){
    completeEmailLinkSignIn().then(function(done){
      if(done) return;
      autoLogin().then(function(ok){ if(!ok){ var l=document.getElementById("login"); if(l) l.style.display="flex"; } }).catch(function(){ var l=document.getElementById("login"); if(l) l.style.display="flex"; });
    }).catch(function(){
      autoLogin().then(function(ok){ if(!ok){ var l=document.getElementById("login"); if(l) l.style.display="flex"; } }).catch(function(){ var l=document.getElementById("login"); if(l) l.style.display="flex"; });
    });
  }

  var AUTH_KEY="cal_auth_email";
  async function autoLogin(){
    var saved; try{ saved=localStorage.getItem(AUTH_KEY); }catch(e){ saved=null; }
    if(!saved) return false;
    if(saved.toLowerCase()===ADMIN_EMAIL){ state.isAdmin=true; state.user=saved; state.plan="full"; enterApp(); return true; }
    await finishCustomerLogin(saved);
    return true;
  }

  function doLogout(){

  /* =========================================================
     訂閱管理後台（管理員專用，state.isAdmin=true 才能進）
     ---------------------------------------------------------
     新增客戶／續約／改方案／停用（可再啟用）／清除裝置／
     刪除——對應screenshot上的完整功能。方案(plan)的實際
     定價與內容還沒定案，這裡只負責標記客戶目前是哪個方案
     （trial/basic/full/family/free），不含任何金流或定價
     邏輯，之後定案只需要調整畫面顯示文字。

  let adminSearchQuery = '';
  let adminExpiringOnly = false;
  const PLAN_LABELS = { trial:'試用', basic:'個人版', full:'完整版', family:'家庭版', free:'免費版' };

  function openAdminView(){
    if(!state.isAdmin){ return; }
    renderAdminView();
    navigate('admin');
  }

  async function renderAdminView(){
    const container = document.getElementById('adminContent');
    container.innerHTML = '<p class="menu-subtitle">載入中...</p>';
    let list = [];
    try{
      const snap = await db.ref('subscribers').once('value');
      const v = snap.val() || {};
      list = Object.keys(v).map(k => Object.assign({ _key:k }, v[k]));
    }catch(e){}

    if(adminSearchQuery.trim()){
      const q = adminSearchQuery.trim().toLowerCase();
      list = list.filter(c => (c.email || '').toLowerCase().includes(q));
    }
    if(adminExpiringOnly){
      const now = Date.now();
      list = list.filter(c => {
        const exp = c.expiry ? Date.parse(c.expiry + 'T23:59:59') : 0;
        return exp && (exp - now) <= 7 * 86400000;
      });
    }
    list.sort((a, b) => (Date.parse(a.expiry || '2099-01-01')) - (Date.parse(b.expiry || '2099-01-01')));

    let html = '<div class="admin-actions-row">';
    html += '<button class="admin-action-btn" id="adminAddBtn">＋ 新增客戶</button>';
    html += '<button class="admin-action-btn warn' + (adminExpiringOnly ? ' active' : '') + '" id="adminExpiringBtn">⚠️ 快到期</button>';
    html += '</div>';
    html += '<div class="search-wrap"><label class="search-box">';
    html += '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#867A6C" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>';
    html += '<input type="text" id="adminSearchInput" placeholder="搜尋 Email" value="' + adminSearchQuery + '">';
    html += '</label></div>';
    html += '<p class="menu-subtitle">共 ' + list.length + ' 位客戶</p>';

    if(list.length === 0){
      html += '<div class="menu-empty-state"><p class="menu-empty-emoji">🔍</p><p class="menu-empty-title">沒有符合的客戶</p></div>';
    } else {
      html += list.map(c => renderAdminCustomerCard(c)).join('');
    }

    container.innerHTML = html;
    bindAdminViewEvents();
  }

  function renderAdminCustomerCard(c){
    const now = Date.now();
    const expMs = c.expiry ? Date.parse(c.expiry + 'T23:59:59') : 0;
    const expired = expMs && now > expMs;
    const lastSeenDays = c.lastSeen ? Math.floor((now - c.lastSeen) / 86400000) : null;
    const deviceCount = c.devices ? Object.keys(c.devices).length : 0;
    const deviceLimit = c.deviceLimit || planDeviceLimit(c.plan);
    const planLabel = PLAN_LABELS[c.plan] || c.plan || '—';
    let statusHtml;
    if(c.status === 'disabled'){ statusHtml = '<span class="admin-status disabled">已停用</span>'; }
    else if(expired){ statusHtml = '<span class="admin-status expired">已過期</span>'; }
    else { statusHtml = '<span class="admin-status active">使用中</span>'; }

    return '<div class="admin-card">' +
      '<p class="admin-card-email">' + c.email + '</p>' +
      '<p class="admin-card-meta">' + planLabel + ' ・ 到期 ' + (c.expiry || '—') + ' ・ ' + statusHtml + '</p>' +
      '<p class="admin-card-meta">最後登入：' + (lastSeenDays === null ? '—' : lastSeenDays + ' 天前') + ' ・ 裝置：' + deviceCount + '/' + deviceLimit + '</p>' +
      '<div class="admin-card-actions">' +
        '<button class="admin-card-btn" data-action="renew" data-key="' + c._key + '">🔄 續約</button>' +
        '<button class="admin-card-btn" data-action="plan" data-key="' + c._key + '">✏️ 改方案</button>' +
        '<button class="admin-card-btn' + (c.status === 'disabled' ? ' enable' : ' disable') + '" data-action="toggle-status" data-key="' + c._key + '">' + (c.status === 'disabled' ? '▶️ 啟用' : '⏸️ 停用') + '</button>' +
        '<button class="admin-card-btn" data-action="clear-devices" data-key="' + c._key + '">📱 清除裝置</button>' +
      '</div>' +
      '<button class="admin-card-btn delete" data-action="delete" data-key="' + c._key + '">🗑️ 刪除</button>' +
    '</div>';
  }

  function bindAdminViewEvents(){
    const addBtn = document.getElementById('adminAddBtn');
    if(addBtn) addBtn.addEventListener('click', adminAddCustomer);
    const expiringBtn = document.getElementById('adminExpiringBtn');
    if(expiringBtn) expiringBtn.addEventListener('click', () => { adminExpiringOnly = !adminExpiringOnly; renderAdminView(); });
    const searchInput = document.getElementById('adminSearchInput');
    if(searchInput) searchInput.addEventListener('input', (e) => { adminSearchQuery = e.target.value; renderAdminView(); });

    document.querySelectorAll('#adminContent [data-action]').forEach(btn => {
      btn.addEventListener('click', () => {
        const action = btn.dataset.action, key = btn.dataset.key;
        if(action === 'renew'){ adminRenew(key); }
        else if(action === 'plan'){ adminChangePlan(key); }
        else if(action === 'toggle-status'){ adminToggleStatus(key); }
        else if(action === 'clear-devices'){ adminClearDevices(key); }
        else if(action === 'delete'){ adminDeleteCustomer(key); }
      });
    });
  }

  async function adminAddCustomer(){
    const email = prompt('新客戶的 Email：');
    if(!email) return;
    const trimmed = email.trim().toLowerCase();
    if(!isEmail(trimmed)){ alert('Email 格式不正確'); return; }
    const key = emailKey(trimmed);
    const now = await getServerTime();
    const expTs = now + 21 * 86400000;
    const rec = { email:trimmed, plan:'trial', expiry:_ymdTs(expTs), status:'active', deviceLimit:2, createdAt:now, lastSeen:now, devices:{} };
    try{ await db.ref('subscribers/' + key).set(rec); alert('已新增客戶：' + trimmed); }
    catch(e){ alert('新增失敗'); }
    renderAdminView();
  }

  async function adminRenew(key){
    const days = prompt('要延長幾天？', '30');
    if(days === null) return;
    const addDays = parseInt(days, 10) || 30;
    try{
      const snap = await db.ref('subscribers/' + key).once('value');
      const sub = snap.val();
      if(!sub) return;
      const now = await getServerTime();
      const baseTs = sub.expiry ? Math.max(Date.parse(sub.expiry + 'T23:59:59'), now) : now;
      const newExp = _ymdTs(baseTs + addDays * 86400000);
      await db.ref('subscribers/' + key + '/expiry').set(newExp);
      await db.ref('subscribers/' + key + '/status').set('active');
      alert('已續約至 ' + newExp);
    }catch(e){ alert('續約失敗'); }
    renderAdminView();
  }

  async function adminChangePlan(key){
    const validPlans = ['trial','basic','full','family','free'];
    const plan = prompt('改成哪個方案？（' + validPlans.join('／') + '）');
    if(!plan) return;
    const trimmed = plan.trim();
    if(validPlans.indexOf(trimmed) === -1){ alert('請輸入：' + validPlans.join('／')); return; }
    try{
      await db.ref('subscribers/' + key + '/plan').set(trimmed);
      await db.ref('subscribers/' + key + '/deviceLimit').set(planDeviceLimit(trimmed));
      alert('已改成 ' + (PLAN_LABELS[trimmed] || trimmed));
    }catch(e){ alert('修改失敗'); }
    renderAdminView();
  }

  async function adminToggleStatus(key){
    try{
      const snap = await db.ref('subscribers/' + key + '/status').once('value');
      const next = snap.val() === 'disabled' ? 'active' : 'disabled';
      await db.ref('subscribers/' + key + '/status').set(next);
    }catch(e){ alert('操作失敗'); }
    renderAdminView();
  }

  async function adminDeleteCustomer(key){
    if(!confirm('確定要刪除這位客戶嗎？此動作無法復原。')) return;
    try{ await db.ref('subscribers/' + key).remove(); }
    catch(e){ alert('刪除失敗'); }
    renderAdminView();
  }

  function adminClearDevices(key){
    if(!state.isAdmin){ return; }
    if(!confirm("清除此客戶的所有裝置紀錄？\n客戶需重新登入。")) return;
    db.ref("subscribers/"+key+"/devices").remove().then(function(){ alert("已清除裝置"); renderAdminView(); })
     .catch(function(){ alert("清除失敗"); });
  }

    document.getElementById('importFileInput').addEventListener('change', importBackup);
    const adminBtn = document.getElementById('openAdminBtn');
    if(adminBtn) adminBtn.addEventListener('click', openAdminView);

  async function shareApp(){
    const url = location.href.split('#')[0].split('?')[0];
    if(navigator.share){
      try{ await navigator.share({ title:'家常煮', text:'一起用家常煮找食譜、排菜單、列採購清單', url:url }); }
      catch(e){}
    } else if(navigator.clipboard){
      try{ await navigator.clipboard.writeText(url); showToast('已複製App連結'); }
      catch(e){ showToast(url); }
    } else {
      showToast(url);
    }
  }

  // 匯出：把BACKUP_KEYS這些「App內容」資料整理成一個JSON
  // 檔案讓使用者下載。刻意不包含登入狀態相關的key
  // （AUTH_KEY／cal_plan這些），因為那些是裝置/登入階段
  // 的狀態，不該被匯入還原、也不該被搬到別的裝置上。
  function exportBackup(){
    const data = {};
    BACKUP_KEYS.forEach(k => {
      const v = localStorage.getItem(k);
      if(v !== null){ data[k] = v; }
    });
    const payload = { app:'jiachangzhu', exportedAt: new Date().toISOString(), data:data };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = '家常煮備份_' + new Date().toISOString().slice(0,10) + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('已匯出備份檔');
  }

  function importBackup(e){
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(){
      try{
        const payload = JSON.parse(reader.result);
        if(!payload || !payload.data){ throw new Error('格式不正確'); }
        if(!confirm('匯入會覆蓋目前這個裝置上的App資料，確定要繼續嗎？')) return;
        Object.keys(payload.data).forEach(k => {
          if(BACKUP_KEYS.indexOf(k) !== -1){ localStorage.setItem(k, payload.data[k]); }
        });
        alert('匯入完成，即將重新整理頁面');
        location.reload();
      }catch(err){
        alert('這個檔案看起來不是有效的備份檔');
      }
    };
    reader.readAsText(file);
  }

  document.querySelectorAll('[data-open-settings]').forEach(btn => {
    btn.addEventListener('click', openSettingsView);
  });

  document.getElementById('adminBackBtn').addEventListener('click', () => navigate('settings'));

  function getAllDishes(){
    return DISHES.filter(d => d.status === "confirmed");
  }

  /* =========================================================
     使用者自建料理的資料層（目前的入口是空的）
     ---------------------------------------------------------
     - userCreatedDishes：跟官方DISHES完全獨立存放，不會寫進
       DISHES，存在 localStorage，重新整理仍會保留。
     - 「AI幫我建立料理」這個功能目前已經移除（家常煮改成
       資料庫優先架構，不依賴AI即時生成，所有搜尋直接讀取
       結構化資料庫）。這個資料結構、source／status欄位
       刻意保留不刪，之後如果要恢復AI功能、或用別的方式
       （例如手動新增自訂料理表單）填進 userCreatedDishes，
       架構不用重寫，只需要接一個新的寫入入口。
     ========================================================= */
  const USER_CREATED_DISHES_KEY = 'jiachangzhu_user_created_dishes_v1';
  let userCreatedDishes = [];

  function loadUserCreatedDishes(){
    try {
      const raw = localStorage.getItem(USER_CREATED_DISHES_KEY);
      userCreatedDishes = raw ? JSON.parse(raw) : [];
    } catch(e){
      userCreatedDishes = [];
    }
  }
  function saveUserCreatedDishes(){
    try {
      localStorage.setItem(USER_CREATED_DISHES_KEY, JSON.stringify(userCreatedDishes));
    } catch(e){
      // localStorage 不可用時忽略，不影響本次操作
    }
  }
  function getUserCreatedDishes(){
    return userCreatedDishes;
  }
  function addUserCreatedDish(dish){
    userCreatedDishes.push(dish);
    saveUserCreatedDishes();
  }
  loadUserCreatedDishes();

  // 官方料理庫＋使用者自己建立（含AI建立）的料理，合併後的
  // 完整可搜尋範圍。找料理、我有食材、分類篩選都要用這個，
  // 不能只用官方 getAllDishes()，否則AI建立的料理會在某些
  // 地方「查得到但比對不到」，出現不一致的體驗。
  function getSearchableDishes(){
    return getAllDishes().concat(getUserCreatedDishes());
  }

  // 詳細頁需要能同時找到官方料理與使用者自建的料理
  function findDishById(id){
    return getAllDishes().find(d => d.id === id) || getUserCreatedDishes().find(d => d.id === id);
  }
  // 與 findDishById 同義，只是命名對應「我的菜單／購物清單」這次規格
  function getDishById(id){
    return findDishById(id);
  }

  /* =========================================================
     這次要煮 ／ 採購
     ---------------------------------------------------------
     selectedMenuDishIds：可持續維護的待煮清單，獨立存在
       （不再依附任何「長期收藏」清單——收藏的角色已經由
       「我的拿手菜」承接）。
     menuServings：每道菜在「這次要煮」中目前選擇的份量，
       跟料理詳細頁的份量調整是分開的兩個狀態，各自獨立。
     採購頁：不是另外存一份清單，而是每次都用
       computeShoppingOverview() 從「這次要煮」＋
       manualShoppingItems（手動新增項目）即時算出來，
       每一項的狀態（要買／已有）直接對應 inventory 裡
       有沒有這一筆，點一下畫面上的項目就是切換 inventory。
     全部只用 localStorage，不會修改原始 DISHES。
     ========================================================= */
  const MENU_SERVINGS_KEY = 'jiachangzhu_menu_servings_v1';
  let menuServingsMap = {};
  function loadMenuServingsMap(){
    try {
      const raw = localStorage.getItem(MENU_SERVINGS_KEY);
      menuServingsMap = raw ? JSON.parse(raw) : {};
    } catch(e){ menuServingsMap = {}; }
  }
  function saveMenuServingsMap(){
    try { localStorage.setItem(MENU_SERVINGS_KEY, JSON.stringify(menuServingsMap)); } catch(e){}
  }
  loadMenuServingsMap();

  function getMenuServings(dishId){
    if(menuServingsMap[dishId]) return menuServingsMap[dishId];
    const dish = getDishById(dishId);
    return dish ? dish.servings : 1;
  }
  function setMenuServings(dishId, servings){
    menuServingsMap[dishId] = Math.max(1, servings);
    saveMenuServingsMap();
  }

  const SELECTED_MENU_KEY = 'jiachangzhu_selected_menu_v1';
  let selectedMenuDishIds = [];
  function loadSelectedMenu(){
    try {
      const raw = localStorage.getItem(SELECTED_MENU_KEY);
      selectedMenuDishIds = raw ? JSON.parse(raw) : [];
    } catch(e){ selectedMenuDishIds = []; }
  }
  function saveSelectedMenu(){
    try { localStorage.setItem(SELECTED_MENU_KEY, JSON.stringify(selectedMenuDishIds)); } catch(e){}
  }
  loadSelectedMenu();

  function isInSelectedMenu(id){
    return selectedMenuDishIds.includes(id);
  }
  function addToSelectedMenu(id){
    if(selectedMenuDishIds.includes(id)) return;
    selectedMenuDishIds.push(id);
    if(!menuServingsMap[id]){
      const dish = getDishById(id);
      if(dish) menuServingsMap[id] = dish.servings;
    }
    saveSelectedMenu();
    saveMenuServingsMap();
  }
  function removeFromSelectedMenu(id){
    const idx = selectedMenuDishIds.indexOf(id);
    if(idx !== -1){
      selectedMenuDishIds.splice(idx, 1);
      saveSelectedMenu();
    }
    if(mealTimeMap[id]){
      delete mealTimeMap[id];
      saveMealTimeMap();
    }
  }
  function toggleSelectedMenu(id){
    if(isInSelectedMenu(id)){ removeFromSelectedMenu(id); }
    else { addToSelectedMenu(id); }
  }
  function getSelectedMenuDishes(){
    return selectedMenuDishIds.map(id => getDishById(id)).filter(Boolean);
  }

  // 早／午／晚餐分類：純粹是「今日料理」頁面上事後的整理，
  // 加入今日料理當下完全不用選，預設是「未分類」。
  // 只影響這個頁面怎麼分組顯示，不影響採購（採購永遠是
  // 全部食材合併在一起算，不分餐別）。
  const MEAL_TIME_KEY = 'jiachangzhu_meal_time_v1';
  let mealTimeMap = {}; // dishId -> 'breakfast'|'lunch'|'dinner'（沒有值＝未分類）
  function loadMealTimeMap(){
    try {
      const raw = localStorage.getItem(MEAL_TIME_KEY);
      mealTimeMap = raw ? JSON.parse(raw) : {};
    } catch(e){ mealTimeMap = {}; }
  }
  function saveMealTimeMap(){
    try { localStorage.setItem(MEAL_TIME_KEY, JSON.stringify(mealTimeMap)); } catch(e){}
  }
  loadMealTimeMap();

  function getMealTime(dishId){
    return mealTimeMap[dishId] || null;
  }
  // 再點一次同一個餐別會取消（回到未分類），符合「選填」的定位
  function setMealTime(dishId, meal){
    if(meal){ mealTimeMap[dishId] = meal; }
    else { delete mealTimeMap[dishId]; }
    saveMealTimeMap();
  }

  function findIngredientCategoryByName(name){
    const found = getAllIngredients().find(e => e.name === name);
    return found ? found.category : "其他";
  }

  // 完成購買 = 標記「已有」的東西會記進這裡（「我的庫存」的
  // 最小資料骨架）。這次不做庫存頁面、不做庫存數量增減／
  // 扣除，也不跟其他庫存管理 App 合併，純粹先把資料存好、
  // 留擴充空間；未來要接你自己那個庫存 App，這份資料格式
  // 已經是通的。
  const INVENTORY_KEY = 'jiachangzhu_inventory_v1';
  let inventory = [];
  function loadInventory(){
    try {
      const raw = localStorage.getItem(INVENTORY_KEY);
      inventory = raw ? JSON.parse(raw) : [];
    } catch(e){ inventory = []; }
  }
  function saveInventory(){
    try { localStorage.setItem(INVENTORY_KEY, JSON.stringify(inventory)); } catch(e){}
  }
  loadInventory();

  function isInInventory(name, unit){
    return inventory.some(i => i.name === name && i.unit === unit);
  }
  // 我有食材頁用：只看名稱是否在庫存中出現過（不管單位），
  // 純粹當作「提示」，不會影響任何自動勾選
  function isNameInInventory(name){
    return inventory.some(i => i.name === name);
  }
  function generateInventoryId(){
    return 'inv_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
  }
  function addToInventory(item){
    if(isInInventory(item.name, item.unit)) return;
    inventory.push({
      id: generateInventoryId(),
      name: item.name,
      unit: item.unit,
      amount: item.amount,
      category: item.category,
      type: item.type || 'ingredient',
      sourceDishIds: item.sourceDishIds || [],
      source: item.source || 'dish',
      markedAt: new Date().toISOString().slice(0, 10)
    });
    saveInventory();
  }
  function removeFromInventory(name, unit){
    inventory = inventory.filter(i => !(i.name === name && i.unit === unit));
    saveInventory();
  }
  // 採購頁的狀態切換：要買 ↔ 已有，兩種狀態，「已有」不管
  // 是本來就有還是剛買的，都是同一個狀態，直接對應庫存
  // 裡「有沒有這一筆」
  function toggleInventoryStatus(item){
    if(isInInventory(item.name, item.unit)){
      removeFromInventory(item.name, item.unit);
    } else {
      addToInventory(item);
    }
  }

  // 使用者自己手動新增的採購項目（不透過料理，例如牛奶、
  // 衛生紙），獨立持久化，跟「這次要煮」算出來的食材需求
  // 分開存，最後在畫面上會合併顯示成同一份清單。
  const MANUAL_ITEMS_KEY = 'jiachangzhu_manual_shopping_items_v1';
  let manualShoppingItems = [];
  function loadManualShoppingItems(){
    try {
      const raw = localStorage.getItem(MANUAL_ITEMS_KEY);
      manualShoppingItems = raw ? JSON.parse(raw) : [];
    } catch(e){ manualShoppingItems = []; }

    try { localStorage.setItem(MANUAL_ITEMS_KEY, JSON.stringify(manualShoppingItems)); } catch(e){}
  }
  loadManualShoppingItems();

  function addManualShoppingItem(name, category){
    const trimmed = (name || '').trim();
    if(!trimmed) return;
    manualShoppingItems.push({
      id: generateShoppingItemId(),
      name: trimmed,
      amount: '',
      unit: '',
      category: category || findIngredientCategoryByName(trimmed),
      createdAt: new Date().toISOString().slice(0, 10)
    });
    saveManualShoppingItems();
  }
  // 用 name+unit 找到對應的手動項目並整筆刪除（不是標記，是真的移除），
  // 如果這筆項目原本被標記「已有」，一併清掉對應的庫存紀錄，
  // 避免留下指向已經不存在項目的孤兒資料
  function removeManualShoppingItem(name, unit){
    const item = manualShoppingItems.find(m => m.name === name && m.unit === unit);
    if(!item) return;
    manualShoppingItems = manualShoppingItems.filter(m => m.id !== item.id);
    saveManualShoppingItems();
    inventory = inventory.filter(i => !(i.name === name && i.unit === unit && i.source === 'manual'));
    saveInventory();
  }
  function generateShoppingItemId(){
    return 'shop_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
  }

  // 這幾樣視為「家中一定有」的常備調味料，永遠不會出現在
  // 「採購」頁裡（不管有沒有標記）
  const ALWAYS_STOCKED_SEASONINGS = ["鹽","糖","醬油","油"];

  // 「採購」頁的完整內容：這次要煮全部需要的食材＋特殊調味料
  // （已排除常備調味料），加上使用者自己手動新增的項目，
  // 全部合併成同一份清單。每一項的狀態（要買／已有）都是
  // 從目前的 inventory 即時算出來，不是另外存一份「加入過」
  // 的紀錄——所以不管資料怎麼變動，畫面永遠反映真實狀況，
  // 不會有「東西消失了」的錯覺，也不需要另外一個「加入」動作。
  function computeShoppingOverview(){
    const dishes = getSelectedMenuDishes();
    const groups = {};

    function addToGroups(name, unit, amount, dishId, type){
      const canonicalName = normalizeIngredientName(name);
      const key = canonicalName + '|' + unit + '|' + type;
      if(!groups[key]){
        groups[key] = { name: canonicalName, unit: unit, rawAmount: 0, sourceDishIds: [], type: type };
      }
      groups[key].rawAmount += amount;
      if(groups[key].sourceDishIds.indexOf(dishId) === -1){
        groups[key].sourceDishIds.push(dishId);
      }
    }

    dishes.forEach(dish => {
      const servings = getMenuServings(dish.id);
      const ratio = servings / dish.servings;
      dish.ingredients.forEach(ing => {
        addToGroups(ing.name, ing.unit, ing.amount * ratio, dish.id, 'ingredient');
      });
      dish.seasonings.forEach(s => {
        if(ALWAYS_STOCKED_SEASONINGS.indexOf(s.name) !== -1) return; // 常備調味料，永遠不列入
        addToGroups(s.name, s.unit, s.amount * ratio, dish.id, 'seasoning');
      });
    });

    const dishItems = Object.keys(groups).map(key => {
      const g = groups[key];
      return {
        name: g.name,
        amount: formatAmount(g.rawAmount, g.unit, 1),
        unit: g.unit,
        type: g.type,
        category: g.type === 'seasoning' ? '調味料' : findIngredientCategoryByName(g.name),
        sourceDishIds: g.sourceDishIds,
        source: 'dish'
      };
    });

    const manualItems = manualShoppingItems.map(m => ({
      name: m.name,
      amount: m.amount,
      unit: m.unit,
      type: 'ingredient',
      category: m.category || '其他',
      sourceDishIds: [],
      source: 'manual'
    }));

    return dishItems.concat(manualItems).map(item => Object.assign({}, item, {
      status: isInInventory(item.name, item.unit) ? 'have' : 'need'
    }));
  }

  const CATEGORY_ORDER = ["全部","家常菜","肉類","蛋料理","蔬菜","湯品"];

    const found = new Set(getSearchableDishes().map(d => d.category));
    const ordered = CATEGORY_ORDER.filter(c => c === "全部" || found.has(c));

    return ordered;

  const USER_CREATED_INGREDIENTS_KEY = 'jiachangzhu_user_created_ingredients_v1';
  let userCreatedIngredients = [];
  function loadUserCreatedIngredients(){
    try {
      const raw = localStorage.getItem(USER_CREATED_INGREDIENTS_KEY);
      userCreatedIngredients = raw ? JSON.parse(raw) : [];
    } catch(e){
      userCreatedIngredients = [];
    }
  }
  function saveUserCreatedIngredients(){
    try {
      localStorage.setItem(USER_CREATED_INGREDIENTS_KEY, JSON.stringify(userCreatedIngredients));
    } catch(e){
      // localStorage 不可用時忽略，不影響本次操作
    }
  }
  function addUserCreatedIngredient(ingredient){
    userCreatedIngredients.push(ingredient);
    saveUserCreatedIngredients();
  }
  loadUserCreatedIngredients();

  // 官方食材 ＋ 使用者透過 AI 新增的食材，合併起來才是完整清單
  function getAllIngredients(){
    return OFFICIAL_INGREDIENTS.concat(userCreatedIngredients);
  }

  function findIngredientById(id){
    return getAllIngredients().find(e => e.id === id);
  }

  // 把 DISHES 食材裡出現的原始名稱，標準化成食材清單中的標準名稱。
  // 查不到的名稱維持原樣（代表目前食材庫還沒有涵蓋，此食材
  // 永遠會被視為「缺少」，這是預期內的行為，之後擴充食材庫即可）
  function normalizeIngredientName(rawName){
    const all = getAllIngredients();
    for(let i = 0; i < all.length; i++){
      const entry = all[i];
      if(entry.name === rawName) return entry.name;
      if(entry.matchNames && entry.matchNames.includes(rawName)) return entry.name;
    }
    return rawName;
  }

  const INGREDIENT_CATEGORY_ORDER = ["蔬菜","肉類","雞肉","海鮮","蛋豆製品","菇類","辛香料","主食"];
  function getIngredientCategories(){
    const found = new Set(getAllIngredients().map(e => e.category));
    const ordered = INGREDIENT_CATEGORY_ORDER.filter(c => found.has(c));
    found.forEach(c => { if(!ordered.includes(c)) ordered.push(c); });
    return ordered;
  }
  const INGREDIENT_CATEGORY_ICON = { "蔬菜":"🥬", "肉類":"🥩", "雞肉":"🐔", "海鮮":"🐟", "蛋豆製品":"🥚", "菇類":"🍄", "辛香料":"🧅", "主食":"🍚" };
  function ingredientCategoryIcon(cat){
    return INGREDIENT_CATEGORY_ICON[cat] || "🍽️";
  }

  const SELECTED_INGREDIENTS_KEY = 'jiachangzhu_selected_ingredients_v1';
  let selectedIngredients = [];
  function loadSelectedIngredients(){
    try {
      const raw = localStorage.getItem(SELECTED_INGREDIENTS_KEY);
      selectedIngredients = raw ? JSON.parse(raw) : [];
    } catch(e){
      selectedIngredients = [];

    }
