      autoLogin().then(function(ok){ if(!ok){ var l=document.getElementById("login"); if(l) l.style.display="flex"; } }).catch(function(){ var l=document.getElementById("login"); if(l) l.style.display="flex"; });
    }).catch(function(){

    });
  }

  var AUTH_KEY="cal_auth_email";
  // D1：開 App 以 Firebase 的登入身分為準，手機裡存的 email 不再當作身分證明
  async function autoLogin(){
    if(!auth){
      // Firebase 沒載入（多半完全沒網路）→ 用上次登入的帳號，方案走 3 天寬限；管理員不開放離線
      var saved; try{ saved=localStorage.getItem(AUTH_KEY); }catch(e){ saved=null; }
      if(!saved || saved.toLowerCase()===ADMIN_EMAIL) return false;
      await finishCustomerLogin(saved);
      return true;
    }
    var u=await waitAuthReady();
    if(!u || !u.email) return false;
    if(u.email.toLowerCase()===ADMIN_EMAIL){ state.isAdmin=true; state.user=u.email; state.plan="full"; localStorage.setItem(AUTH_KEY,u.email); enterApp(); return true; }
    await finishCustomerLogin(u.email);
    return true;
  }

  // 管理員登入：Email＋密碼（密碼存在 Firebase，程式裡沒有）
  async function adminLogin(){
    var em=document.getElementById('adminEmailInput').value.trim(), pw=document.getElementById('adminPwInput').value;
    var msg=document.getElementById('adminLoginMsg'), btn=document.getElementById('adminLoginBtn');
    msg.textContent='';

    if(!auth){ msg.textContent='登入服務暫時無法使用，請確認網路後再試'; return; }
    btn.disabled=true; btn.textContent='登入中…';
    try{
      var cred=await auth.signInWithEmailAndPassword(em, pw);
      if(!cred.user || String(cred.user.email||'').toLowerCase()!==ADMIN_EMAIL){
        try{ await auth.signOut(); }catch(e){}
        msg.textContent='這個帳號不是管理員';
      } else {
        _authReadyPromise=null; document.getElementById('adminPwInput').value='';
        state.isAdmin=true; state.user=cred.user.email; state.plan='full';
        localStorage.setItem(AUTH_KEY,cred.user.email);

    }catch(e){
      var c=(e&&e.code)||'';
      msg.textContent=(c==='auth/wrong-password'||c==='auth/invalid-credential'||c==='auth/user-not-found'||c==='auth/invalid-login-credentials') ? 'Email 或密碼錯誤'
        : (c==='auth/too-many-requests') ? '嘗試次數太多，請稍後再試'
        : '登入失敗，請確認網路後再試';
    }
    btn.disabled=false; btn.textContent='管理員登入';

  function renderAdminCustomerCard(c){
    const now = Date.now();
    const expMs = c.expiry ? Date.parse(c.expiry + 'T23:59:59') : 0;
    const expired = expMs && now > expMs;
    const lastSeenDays = c.lastSeen ? Math.floor((now - c.lastSeen) / 86400000) : null;
    const deviceCount = c.devices ? Object.keys(c.devices).length : 0;
    const deviceLimit = c.deviceLimit || planDeviceLimit(c.plan);
    const planLabel = PLAN_LABELS[c.plan] || c.plan || '—';
    let statusHtml;
    if(c.status === 'disabled'){ statusHtml = '<span class="admin-status disabled">已停用</span>'; }
    else if(expired){ statusHtml = '<span class="admin-status expired">已過期</span>'; }
    else { statusHtml = '<span class="admin-status active">使用中</span>'; }

    return '<div class="admin-card">' +
      '<p class="admin-card-email">' + c.email + '</p>' +
      '<p class="admin-card-meta">' + planLabel + ' ・ 到期 ' + (c.expiry || '—') + ' ・ ' + statusHtml + '</p>' +
      '<p class="admin-card-meta">最後登入：' + (lastSeenDays === null ? '—' : lastSeenDays + ' 天前') + ' ・ 裝置：' + deviceCount + '/' + deviceLimit + '</p>' +
      '<div class="admin-card-actions">' +
        '<button class="admin-card-btn" data-action="renew" data-key="' + c._key + '">🔄 續約</button>' +
        '<button class="admin-card-btn" data-action="plan" data-key="' + c._key + '">✏️ 改方案</button>' +
        '<button class="admin-card-btn' + (c.status === 'disabled' ? ' enable' : ' disable') + '" data-action="toggle-status" data-key="' + c._key + '">' + (c.status === 'disabled' ? '▶️ 啟用' : '⏸️ 停用') + '</button>' +
        '<button class="admin-card-btn" data-action="clear-devices" data-key="' + c._key + '">📱 清除裝置</button>' +
      '</div>' +
      '<button class="admin-card-btn delete" data-action="delete" data-key="' + c._key + '">🗑️ 刪除</button>' +
    '</div>';
  }

  function bindAdminViewEvents(){
    const addBtn = document.getElementById('adminAddBtn');
    if(addBtn) addBtn.addEventListener('click', adminAddCustomer);

    if(expiringBtn) expiringBtn.addEventListener('click', () => { adminExpiringOnly = !adminExpiringOnly; renderAdminView(); });
    const searchInput = document.getElementById('adminSearchInput');
    if(searchInput) searchInput.addEventListener('input', (e) => { adminSearchQuery = e.target.value; renderAdminView(); });

    document.querySelectorAll('#adminContent [data-action]').forEach(btn => {
      btn.addEventListener('click', () => {
        const action = btn.dataset.action, key = btn.dataset.key;
        if(action === 'renew'){ adminRenew(key); }
        else if(action === 'plan'){ adminChangePlan(key); }
        else if(action === 'toggle-status'){ adminToggleStatus(key); }
        else if(action === 'clear-devices'){ adminClearDevices(key); }
        else if(action === 'delete'){ adminDeleteCustomer(key); }
      });
    });

    // 模擬方案：只改變這次瀏覽時記憶體裡的state.plan，
    // 不寫入localStorage、不動到Firebase任何資料，重新
    // 整理頁面或重新登入就會恢復真實的方案狀態
  }

  async function adminAddCustomer(){
    const email = prompt('新客戶的 Email：');
    if(!email) return;
    const trimmed = email.trim().toLowerCase();
    if(!isEmail(trimmed)){ alert('Email 格式不正確'); return; }
    const key = emailKey(trimmed);
    const now = await getServerTime();
    const expTs = now + 14 * 86400000;
    const rec = { email:trimmed, plan:'trial', expiry:_ymdTs(expTs), status:'active', deviceLimit:planDeviceLimit('trial'), createdAt:now, lastSeen:now, devices:{} };
    try{ await db.ref('jiachangzhu_subscribers/' + key).set(rec); alert('已新增客戶：' + trimmed); }
    catch(e){ alert(failMsg('新增', e)); }
    renderAdminView();
  }

  async function adminRenew(key){
    const days = prompt('要延長幾天？', '30');
    if(days === null) return;
    const addDays = parseInt(days, 10) || 30;
    try{
      const snap = await db.ref('jiachangzhu_subscribers/' + key).once('value');
      const sub = snap.val();
      if(!sub) return;
      const now = await getServerTime();
      const baseTs = sub.expiry ? Math.max(Date.parse(sub.expiry + 'T23:59:59'), now) : now;
      const newExp = _ymdTs(baseTs + addDays * 86400000);
      await db.ref('jiachangzhu_subscribers/' + key + '/expiry').set(newExp);
      await db.ref('jiachangzhu_subscribers/' + key + '/status').set('active');
      alert('已續約至 ' + newExp);
    }catch(e){ alert(failMsg('續約', e)); }
    renderAdminView();
  }

  async function adminChangePlan(key){
    // 簡化成三選一，輸入數字即可；完整版統一存成 full

    const trimmed = choiceMap[plan.trim()];
    if(!trimmed){ alert('請輸入 1、2 或 3'); return; }
    try{
      await db.ref('jiachangzhu_subscribers/' + key + '/plan').set(trimmed);
      await db.ref('jiachangzhu_subscribers/' + key + '/deviceLimit').set(planDeviceLimit(trimmed));
      alert('已改成 ' + (PLAN_LABELS[trimmed] || trimmed));
    }catch(e){ alert(failMsg('修改', e)); }
    renderAdminView();
  }

  async function adminToggleStatus(key){

      catch(e){}
    } else if(navigator.clipboard){
      try{ await navigator.clipboard.writeText(url); showToast('已複製App連結'); }
      catch(e){ showToast(url); }
    } else {
      showToast(url);
    }
  }

  // 匯出：把BACKUP_KEYS這些「App內容」資料整理成一個JSON
  // 檔案讓使用者下載。刻意不包含登入狀態相關的key
  // （AUTH_KEY／cal_plan這些），因為那些是裝置/登入階段
  // 的狀態，不該被匯入還原、也不該被搬到別的裝置上。
  function exportBackup(){
    const data = {};
    BACKUP_KEYS.forEach(k => {
      const v = localStorage.getItem(k);
      if(v !== null){ data[k] = v; }
    });
    const payload = { app:'jiachangzhu', exportedAt: new Date().toISOString(), data:data };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = '食在料理備份_' + new Date().toISOString().slice(0,10) + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('已匯出備份檔');
  }

  function importBackup(e){
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(){
      try{
        const payload = JSON.parse(reader.result);
        if(!payload || !payload.data){ throw new Error('格式不正確'); }
        if(!confirm('匯入會覆蓋目前這個裝置上的App資料，確定要繼續嗎？')) return;
        Object.keys(payload.data).forEach(k => {
          if(BACKUP_KEYS.indexOf(k) !== -1){ localStorage.setItem(k, payload.data[k]); }
        });
        alert('匯入完成，即將重新整理頁面');
        location.reload();
      }catch(err){
        alert('這不是本 App 的備份檔');
      }
    };
    reader.readAsText(file);
  }

  document.querySelectorAll('[data-open-upgrade]').forEach(btn => {

  });

  document.getElementById('upgradeBackBtn').addEventListener('click', () => navigate('find'));
  document.getElementById('adminBackBtn').addEventListener('click', () => navigate('settings'));
